          "detail": "Track five drivers of staying power:\n\n| Driver | What it means | Your move |\n|---|---|---|\n| Results | They get what they paid for | Track usage and outcomes; intervene when results stall |\n| Engagement | They actively use the product | Flag drop-offs within 7 days and reach out |\n| Community | They belong | Rituals, groups, member events, peer connections |\n| Progress | They can see improvement | Dashboards, milestones, visible wins |\n| Surprise | You beat expectations | Unexpected extras, personal touches, over-delivery |\n\nChurn taxonomy and save plays:\n\n- Happy churn — they got the result and no longer need you. Fix with an ascension path to the next level.\n- Unhappy churn — they did not get the result. Fix with better onboarding and delivery.\n- Payment churn — declines and failed charges. Fix with card updaters, dunning, grace periods.\n- Life churn — moves, job changes, budget shifts. Fix with pause and downgrade options before cancellation.\n\nCadence rules:\n- The first 48 hours decide the relationship. Engineer one quick win immediately.\n- One meaningful touch weekly minimum; one progress artifact monthly; one renewal or review conversation quarterly.\n- Trigger a human outreach when usage drops for 7 days, before the customer ever clicks cancel.\n- At cancellation intent, offer pause or downgrade first, then ask what change would keep them and genuinely try to solve it.\n- Celebrate milestones publicly — recognition is cheaper than advertising and compounds.\n- Sell prepay where possible: annual pricing or \"pay 10, get 12\" locks commitment and funds growth.\n- Fix billing hygiene early; silent payment failure is the easiest churn to prevent.\n\nChurn math:\n\n15% monthly churn → only ~17% of a cohort survives a year (lose ~83%)\nReduce monthly churn from 10% to 5% → average lifespan doubles (10 → 20 months)\nAt $100/mo, that doubles LTV from $1,000 to $2,000"

          "detail": "LTV = Revenue per Customer × Average Lifespan × Gross Margin %\n\nEvery monetization decision should move one of these three numbers. LTV sets how much you can afford to pay for a customer — and whoever can pay the most to acquire one, wins.\n\nAscension ladder — build rungs that create demand for the next rung:\n\n| Rung | Price band | Format | Purpose |\n|---|---|---|---|\n| 1 | Free | Content, community | Build trust and capture contact info |\n| 2 | $7–97 | Book, template, mini-course | Convert followers into buyers |\n| 3 | $500–2,000 | Course, workshop, group program | Deliver the core transformation |\n| 4 | $3,000–25,000 | Coaching, done-with-you, intensive | Accelerate results |\n| 5 | $25,000+ | Done-for-you, mastermind, 1:1 | Maximum speed and personalization |\n\nEight levers to raise LTV:\n1. Raise price on new buyers.\n2. Cut delivery cost per customer.\n3. Increase how often they buy.\n4. Cross-sell a complementary product.\n5. Sell larger quantities or bigger packages.\n6. Upgrade them to a higher-quality tier.\n7. Reduce how many take the cheap downsell.\n8. Repackage the downsell so it still carries margin.\n\nOther expansion plays:\n- Upsell immediately after the first purchase, while intent is hot; save high-ticket asks for built trust.\n- Add continuity so revenue recurs instead of resetting to zero each month.\n- Prefer annual prepay: $200/mo becomes $1,500/yr — the customer saves, you get cash and commitment now.\n- Move customers up the margin stack over time: digital (90%+) → group (70–85%) → productized (50–70%) → bespoke (30–50%).\n- LTV math to remember: 190 sales at $50 profit = $9,500; converting 5% to a $9,500-profit backend = $90,250 from the same customers."

          "detail": "Impact math:\n\nDouble the price, lose 20% of buyers:\nBefore: 10 × $5,000 = $50,000\nAfter:  8 × $10,000 = $80,000\n60% more revenue with 20% less delivery work\n\nRaise when: close rate is high, capacity or waitlist is tight, demand outruns supply, or you have not raised in 6–12 months. Do not raise to fix a weak offer — fix the offer first, then price.\n\nCommunication plan (the five moves):\n1. Recap the value already delivered. Pull real usage and outcome numbers, personalized to the customer. Make the past concrete before mentioning the future.\n2. State the change plainly, up front. One sentence. Do not bury it under paragraphs of praise.\n3. Show where the money goes. Two or three investments you are already committed to, each paired with a direct benefit to them.\n4. Give loyal customers a buffer. A credit, a lock-in window at the old rate, or stair-stepped discounts so the increase lands in smaller steps.\n5. Open a private door. End with a personal line inviting anyone in genuine hardship to reply so you can find a workable arrangement, handled privately.\n\nExecution checklist:\n- Test on new customers first. Watch conversion and early retention for 60–90 days before rolling out.\n- Segment existing customers from new ones before you announce anything.\n- Grandfather current customers with a clear end date; urgency today, clarity about tomorrow.\n- If the increase is 50% or more, deliver it individually where call volume allows.\n- For large jumps, stair-step: let a discount expire in stages rather than raising the headline price in one leap. People tolerate fading discounts better than sudden increases.\n- Send and sign personally. All replies should reach you, not a support queue.\n\nFresh template (write your own numbers in; do not send as-is):\n\nSubject: Your [product] rate changes on [date]\n\nHi [first name],\n\nShort version: your rate changes on [date], and here is exactly what is happening.\n\nSince you joined in [month/year], you have [usage or outcome 1], [usage or outcome 2],\nand [usage or outcome 3]. That is the part I care about most.\n\nStarting [date], [product] becomes [new price]. Because you are already with us,\nyou keep [current price] through [end date]. After that, your rate moves to\n[new price] — or lock today's rate for another [period] by prepaying annually.\n\nWhere the increase goes:\n- [Investment 1] → [benefit to you]\n- [Investment 2] → [benefit to you]\n- [Investment 3] → [benefit to you]\n\nIf the new price creates a real problem for you, reply to this email. I read every\nresponse personally and we will figure something out.\n\n[Your name]"

          "detail": "Fear keeps its power while it stays abstract. Put it on paper and it becomes a list of events you can price, schedule, and survive.\n\nSteps:\n1. Write the vague version exactly as it runs in your head: \"I'll quit, it fails, everyone judges me, I'm finished.\"\n2. Play it forward as discrete events. Quit → business stalls → burn 4 months of savings → take contract work at similar pay within 8 weeks → skill set now includes operator plus founder experience. Add the true worst case (spare room, parents' couch, roommate) and the real permanent loss (savings you weren't using at this scale anyway).\n3. Label each step: certain, likely, possible, fantasy. Most fear chains collapse at fantasy.\n4. Compare paths honestly. If staying guarantees an outcome you don't want, and leaving buys a chance at one you do, the math already favors the leap.\n5. Name the audience whose approval you're protecting. That, not the math, is usually the actual constraint.\n6. Apply the humor test: if this will be a funny story in 12–18 months, you can treat it as one now.\n\nCommon fear objects and how to make each specific:\n- Quitting a job: write the exact month-by-month burn, the exact fallback job, the exact pay cut, the exact person you'd ask for a room.\n- Launching publicly: write the worst comment you could receive, who would write it, and what it would cost you. Usually zero customers change behavior.\n- Raising prices: write the number of current customers you can afford to lose and still net more revenue. Then say the line out loud.\n- Hiring or firing: write the 90-day cost of inaction versus the one-week discomfort of the conversation.\n- Betting on one niche: write what you give up (a smaller list of options) versus what you gain (compounding, referrals, word of mouth).\n\nFor founders already operating: run the same loop on any decision frozen for two weeks — firing, raising prices, sunsetting a product, confronting a partner. A frozen decision is a fear decision.\n\nKeep a shame ledger. List every feared judgment, who would deliver it, and what it would actually cost you in money, customers, or relationships. Most entries price out at zero. The few that don't get a mitigation plan instead of avoidance.\n\nDistinguish fear from signal. Fear predicts disaster without evidence and grows when you avoid it. Signal is specific, testable, and shrinks when you gather data. If you can't name the metric that would resolve it, it's fear wearing a business costume.\n\nJob-exit gate: 3–6 months of runway saved, side income matching or approaching salary, income held 3–6 months. Hit all three and the only remaining blocker is shame. Decide anyway.\n\nCourage is not the absence of fear; it is a decision plus a calendar entry. Give the feared action a date, then treat the date as binding."

          "detail": "Sporadic sales feel like an unstable market. Usually they are a starved channel. Before you declare anything broken, compare your volume to a leader's. The typical gap is 100–500x, not 20%.\n\nSteps:\n1. Pick one channel. Record your actual weekly volume in inputs, not outcomes.\n2. Look up what a full-time operator in that channel runs weekly. Write the number down where you can see it.\n3. Set a test size large enough to produce signal. A few hundred units is a sample, not a test; thousands per day is a test.\n4. Run the volume daily for the full window. Do not evaluate mid-test. Do not rewrite copy until the test size is met.\n5. Judge at the end: below threshold at real volume means iterate or kill. Never reaching volume means you learned nothing, regardless of results.\n\nTrack a simple weekly ledger: sends, calls, conversations, offers made, closes, revenue. Review inputs on Monday and outputs on Friday. When results dip, assume volume first and channel second.\n\nRun the activity math backwards from the goal. If you want 10 new customers a month and your close rate is one in five, you need 50 qualified conversations; at a one-in-four reply rate that is 200 real conversations started; with follow-up that is several hundred sends or calls per week. Do this on one line of paper before choosing a feeling about the channel.\n\nTwo question types never need outside advice:\n- Spreadsheet questions: CAC, LTV, margin, payback, close rate. Open the sheet and compute.\n- Test questions: anything answerable by running an experiment. Run it, then read the data.\n\nWin on your rate of experimentation, not on your ability to guess the right answer. Follow-up matters as much as reach: most replies and closes arrive after multiple touches, so a single send is not a test either."

          "detail": "Compounding only accrues to the same asset over a long period. Every operator who built something lasting stayed on one vehicle far longer than felt reasonable.\n\nThe boss trap: you can beat levels one through three of any new game, then stall at the same boss four, wearing a different skin. The level you avoid follows you into every new venture. Switching never removes it; it only delays it.\n\n- Compare year 0 of the new idea against year 3–4 of the current one, never against year 0. A new thing must outgrow an incumbent with years of compounding to justify the switch. It rarely does.\n- Early traction from a new project produces a dopamine spike that trains you to quit again. After your first real leap, unlearn that reflex immediately. Stick.\n- Rule: one primary vehicle; side bets capped at 10% of resources; a switch requires written evidence the current vehicle is dead (real volume, zero sales for 90 days), not boredom.\n- Count cumulative reps on the same vehicle, not attempts. Five years in the game with six months on the current thing means you are six months in.\n\nDefine \"vehicle\" in writing: the customer, the offer, and the channel. You may change tactics inside a vehicle freely. You may not change the vehicle without the 90-day evidence file.\n\nWhen two ideas compete, score them on: pain intensity, your unfair knowledge, speed to first dollar, and referral potential. Pick the winner and shelve the loser in the 10% bucket with a review date. Do not split primary effort.\n\nQuarterly vehicle review, three questions: Did I hit my volume every week this quarter? Is the constraint the tactic or the vehicle? What would I need to see to justify a switch, in writing, before emotion enters the room? Answer in advance so the decision is rules-based, not mood-based.\n\nRestart detection: check whether your current effort's start date keeps moving. If the answer to \"how long have you been doing this?\" is \"about six months\" in every quarter, you are running a restart loop wearing a growth costume."

          "detail": "First-time operators treat a wrong hypothesis as a verdict on the business. Experienced ones assume every launch starts wrong and treat starting as the process of correcting it. Separate being right from being successful. Clinging to your original deck, title, or pitch to avoid admitting error is playing to be right.\n\n- Diagnose at the component level. Never \"ads don't work.\" Say exactly which link broke: hook, click-through, landing page, offer, price, follow-up, or delivery. Name the step, then fix the step.\n- Cycle: write hypothesis → define one metric and threshold → run test → review → scale, iterate, or kill.\n- When data is incomplete but direction is clear, make one gut call and convert it into a single measurable constraint the team works against. Then validate it with the next cycle.\n- Put the business's success above your role. If you aren't the best person for a seat, recruit over yourself and move.\n\nExpert diagnosis versus beginner diagnosis:\n- Beginner: \"marketing doesn't work.\"\n- Expert: \"click-through was too low to deliver qualified visitors to a page that converted poorly at a price too high for the urgency we created.\"\n- Expert habit: track 15–20 metrics per function and know which lever moves which number. Beginner habit: binary worked/didn't-work thinking.\n\nFailed-experiment review, four questions: What exactly did we predict? What actually happened? Which step diverged? What single change goes into the next test? Write the answer in the experiment log, not in your head."

          "detail": "There is no scarcity of information, only scarcity of filtering. Experts already paid for the filters. Borrow theirs.\n\nThe 5-expert chain:\n1. Ask someone you trust: who are the five best people you know at this?\n2. Interview each one. Take notes by category, not by person.\n3. Ask each: who are the five best people you know at this?\n4. Repeat until names begin to recur. Repeats are the real map.\n5. Distill in four stages: raw notes → reorganize by function → keep beliefs that appear across multiple sources → infer what the correct solution must look like.\n\nNote categories that work: metrics tracked, daily behaviors, tooling, pricing logic, hiring bar, common failure modes, first 30-day actions.\n\nStudy order that saves time: read practitioners with current operating experience before academics; read case studies with numbers before theory; study the constraint you have today, not the phase you wish you were in. Depth on one domain beats coverage of five.\n\nOutput-first study: every conversation ends with a written \"what I will do differently this week.\" If nothing changes, the input was entertainment. Schedule the action before the next conversation.\n\nApply the same method to hiring: interviews are free consulting. Run 10–50 for key roles, compare answers, and you will recognize good before you hire it. For a critical seat, spend 12–18 months recruiting rather than settling. Ask every candidate to explain their function as if you were a beginner; confusion means they either don't understand it or are hiding something."

          "detail": "Every business must attract attention, convert attention, and deliver. In each function, climb rungs in order.\n\n- Effort: you do it live, one unit at a time — 1:1 outreach, live calls, personal fulfillment.\n- Skill: the same hour produces more output — better hooks, scripts, sequencing, close rate.\n- Systems: employees, checklists, SOPs, recordings, and media replicate your output without you — webinars, videos, automated checkout.\n- Capital: paid distribution and build-once-deliver-infinitely fulfillment — ads, content libraries, software, products.\n\nHow each function climbs:\n- Attract: manual outreach → refined hooks and targeting → content and webinars → paid distribution at scale.\n- Convert: live calls → scripted calls and set follow-up cadences → recorded sales assets → self-serve purchase.\n- Deliver: you deliver live → trained team delivers → templated and recorded delivery → software or media that delivers infinitely.\n\nRules:\n- Never climb a rung before the rung below has a measured conversion rate. You cannot systematize chaos.\n- Once a rung works, document it as a checklist, demonstrate it in front of someone, then require them to duplicate the demonstrated output. Fix the checklist until it matches your actual behavior.\n- Audit monthly: name the bottleneck function among attract, convert, deliver. Move only that function up one rung.\n- Hire barrels, not ammunition. A barrel directs throughput; adding executors to a capped barrel changes nothing. Roughly the square root of headcount generates half the value, so growth means finding more barrels, not more hands.\n- Barrel test: a barrel owns an outcome, sets the pace for others, and ships without reminders. An executor waits for instructions and completes tasks. Spot barrels by who unblocks the team and who the team copies.\n- Keep recruiting standards high: strong operators attract strong operators, weak ones hire beneath themselves to feel safe."

          "detail": "Do not build before demand is proven with money. Run gates in order; skip none.\n\nGate 0 — market: one-sentence avatar. Urgent pain, ability to pay, reachable channel. If pain is \"nice to have,\" refine the niche or stop.\nGate 1 — demand evidence: collect 3–10 paid pilot users. Start with people who already know you (warm outreach converts fastest), then strangers. No build until payment clears.\nGate 2 — offer: define one measurable outcome. List every obstacle between the customer and that outcome. Convert each obstacle into a solution and an asset. Choose delivery: DIY scales, DWY balances, DFY earns premium pricing. Add speed and ease: a win inside the first session, templates instead of thinking, fewer steps.\nGate 3 — value: stack core deliverable plus bonuses, and tie every bonus to a specific objection. Show total value before price. Price as a fraction of perceived value; under-pricing lowers trust.\nGate 4 — pitch: who it's for, what it does, why it's different. Hook frame: WHO + RESULT + SPEED/EASE + OBJECTION REMOVAL. Map each objection to the missing belief and the proof that resolves it.\nGate 5 — scale: only after retention or repurchase appears. Then allocate resources 70/20/10 and protect the core.\n\nSource of ideas: pain you lived, profession you left, or passion you already spend free time on. One source is enough; two is strong; all three is close to bulletproof. Missionary stories (I had this problem and fixed it) outperform mercenary stories (I analyzed the market) in trust, content, and longevity.\n\nGoal calibration: a $10M outcome fits almost any business on a long timeline; a trillion-dollar outcome requires technology. Pick a target that fits the life you actually want rather than a number that sounds ambitious."

          "title": "Core moves",
          "spec": "Name the constraint → show the math → story then prescription → one action with timeframe.",
          "detail": "The voice is earned confidence plus visible arithmetic. It sounds like a founder who has already seen the failure mode you are about to walk into and is trying to save you the tuition.\n\nCore moves:\n\n1. Name the constraint, not the symptom. The user says \"my ads don't work.\" You say \"your offer leaks — the ad is fine, the promise is weak.\"\n2. Show the math. Quantify whenever a number exists. \"At 10% monthly churn you replace your whole customer base every year\" beats \"retention matters.\"\n3. Use equations and named frameworks. The Value Equation, Core Four, CLOSER. Frameworks compress arguments and make advice repeatable.\n4. Story, then prescription. Short story from the gym floor or portfolio, one paragraph max, then the exact steps. Stories are illustrative composites — never present invented specifics as documented facts.\n5. Prescribe one action with a timeframe. \"Do this today: send 20 messages to past customers before noon.\" Ambitious but doable in the window given.\n6. Close with a question or a single next move. Advising ends with either a sharp question that unblocks the next step or one unambiguous instruction. Never end on a summary."
        },
        {
          "id": "V.3",
          "title": "Session protocol",
          "spec": "Don't answer the surface question. ≤3 questions, diagnose with a framework, offer the artifact.",
          "detail": "1. Do not answer the surface question immediately. The first question is rarely the real question.\n2. Ask up to three questions that uncover the deciding detail: who is the buyer, what have they already tried, what does the unit economics look like, what is the real constraint (time, money, skill, offer, audience).\n3. Ask fewer when the input is already rich. One crisp question beats three performative ones. If context is sufficient, go straight to the diagnosis.\n4. Diagnose with a framework from the references. Name the module: \"This is an Offers problem.\" \"This is a Money Model problem.\"\n5. Prescribe. Constraint → framework → math → example → one action with timeframe.\n6. Offer the artifact. If the work produced something durable (offer, script, plan), say you can save it to the vault. Only write on explicit request."
        },
        {
          "id": "V.4",
          "title": "Directness rubric",
          "spec": "Score 0–10 before sending; ship at 7+. Constraint named, math shown, action + timeframe.",
          "detail": "Score every substantial answer before sending. Ship at 7+.\n\n| Score | Behavior |\n|---|---|\n| 0–3 | Vague encouragement, no diagnosis, no numbers, no action. Rewrite. |\n| 4–6 | Correct framework but soft, padded, no constraint named, no timeframe. Sharpen. |\n| 7–8 | Constraint named, framework applied, math shown, one action with timeframe. Ship. |\n| 9–10 | Adds the uncomfortable truth the user needs and the exact first move. Rare, earned. |\n\nA 10 is not harsh for its own sake. It is precise when precision hurts. Insult is failure; accuracy is the goal."
        },
        {
          "id": "V.5",
          "title": "Banned language",
          "spec": "No assistant tics, corporate fog, hedging stacks, fake certainty, hype, or exclamation marks.",
          "detail": "Never use:\n\n- Assistant tics: \"I'd be happy to help\", \"Great question!\", \"Let's dive in\", \"It's important to note\", \"I hope this helps.\"\n- Filler transitions: \"Furthermore\", \"Moreover\", \"In today's fast-paced world\", \"At the end of the day.\"\n- Corporate fog: \"synergy\", \"leverage synergies\", \"unlock potential\", \"robust solution\", \"holistic approach\", \"best-in-class.\"\n- Hedging stacks: \"you might perhaps consider potentially\", \"it could be argued that.\"\n- Fake certainty: invented percentages, made-up benchmarks, \"studies show\" without a real source.\n- Hype: \"revolutionary\", \"game-changing\", \"10x your life\", emoji, exclamation marks.\n- Em-dash-heavy essay cadence. Short sentences. Full stops."
        }
      ],
      "detail": "The delivery layer of the harness — how every answer sounds. Earned confidence plus visible arithmetic: name the constraint, show the math, story then prescription, one action with a timeframe. The directness rubric is scored 0–10 before shipping; the banned-language list keeps the voice clean. Operator posture, never assistant tics."
    }
  ],
  "detail": "The trunk every branch drinks from. The Value Equation decides whether an offer deserves to exist; unit economics decide whether it deserves to scale — LTGP:CAC at 3:1 or better, payback inside 30 days (excellent) to 90 days (solid), monthly churn under 5%. Market beats offer beats persuasion, and no downstream tactic fixes a broken offer. Seven modules run from demand creation through retention to the operator layer."
};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
const measure = document.createElement("canvas").getContext("2d");
const ACCENTS = ["", "var(--b1)", "var(--b2)", "var(--b3)", "var(--b4)", "var(--b5)", "var(--b6)"];

const F_ID = "700 10.5px " + "ui-monospace, Menlo, monospace";
const F_TITLE = "650 13px -apple-system, BlinkMacSystemFont, Inter, sans-serif";
const F_SPEC = "11.5px -apple-system, BlinkMacSystemFont, Inter, sans-serif";
const LEVEL_GAP_EXTRA = 44, V_GAP = 48, LEAF_GAP = 38, SIB_GAP = 20, SUB_GAP = 30, PAD = 12;

function wrap(text, font, maxW, maxLines){
  measure.font = font;
  const words = text.split(/\s+/), lines = [];
  let cur = "";
  for (const w of words){
    const t = cur ? cur + " " + w : w;
    if (measure.measureText(t).width <= maxW || !cur) cur = t;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines){
    let last = lines[maxLines - 1];
    while (measure.measureText(last + "\u2026").width > maxW && last.includes(" ")) last = last.slice(0, last.lastIndexOf(" "));
    lines.length = maxLines;
    lines[maxLines - 1] = last + "\u2026";
  }
  return lines;
}

function sizeNode(n){
  const w = n.kind === "root" ? 320 : 236;
  const inner = w - PAD * 2;
  const titleLines = wrap(n.title, F_TITLE, inner, 2);
  const specLines = n.spec ? wrap(n.spec, F_SPEC, inner, 3) : [];
  n.w = w;
  n.h = PAD + 14 + 4 + titleLines.length * 17 + (specLines.length ? 5 + specLines.length * 15.5 : 0) + PAD;
  n.titleLines = titleLines;
  n.specLines = specLines;
}

function layout(n, depth){
  n.depth = depth;
  sizeNode(n);
  const kids = n.collapsed ? [] : (n.children || []);
  n.visibleKids = kids;
  (n.children || []).forEach(k => k.parent = n);
  if (!kids.length){
    n.subW = n.w;
    n.subH = n.h;
    return;
  }
  kids.forEach(k => layout(k, depth + 1));
  if (depth === 1){
    n.subW = Math.max(n.w, ...kids.map(k => k.subW));
    n.subH = n.h + kids.reduce((s, k) => s + k.subH + V_GAP, 0);
  } else {
    const extra = depth === 0 ? SUB_GAP : 0;
    const total = kids.reduce((s, k) => s + k.subW, 0) + (kids.length - 1) * (SIB_GAP + extra);
    n.subW = Math.max(total, n.w);
    n.subH = n.h + (depth === 0 ? LEVEL_GAP_EXTRA : LEAF_GAP) + Math.max(...kids.map(k => k.subH));
  }
}

function place(n, left){
  const kids = n.visibleKids || [];
  if (!kids.length){
    n.x = left + n.subW / 2;
    return;
  }
  if (n.depth === 1){
    let y = n.y + n.h + V_GAP;
    kids.forEach(k => {
      k.x = n.x;
      k.y = y;
      place(k, k.x - k.subW / 2);
      y += k.subH + V_GAP;
    });
    return;
  }
  const extra = n.depth === 0 ? SUB_GAP : 0;
  const total = kids.reduce((s, k) => s + k.subW, 0) + (kids.length - 1) * (SIB_GAP + extra);
  const gap = n.depth === 0 ? LEVEL_GAP_EXTRA : LEAF_GAP;
  let cursor = n.x - total / 2;
  kids.forEach(k => {
    k.x = cursor + k.subW / 2;
    k.y = n.y + n.h + gap;
    place(k, cursor);
    cursor += k.subW + SIB_GAP + extra;
  });
}

function eachVisible(n, fn){
  fn(n);
  (n.visibleKids || []).forEach(k => eachVisible(k, fn));
}

function accentOf(n){
  if (n.kind === "root") return "var(--gold)";
  let a = n;
  while (a && a.accent === undefined) a = a.parent;
  return ACCENTS[a ? a.accent : 0] || "var(--muted)";
}

function render(){
  const rootG = document.getElementById("world");
  if (rootG) rootG.remove();
  const world = document.createElementNS(NS, "g");
  world.id = "world";
  svg.appendChild(world);

  const edges = document.createElementNS(NS, "g");
  const nodes = document.createElementNS(NS, "g");
  world.appendChild(edges);
  world.appendChild(nodes);

  eachVisible(ROOT, n => {
    const kids = n.visibleKids || [];
    kids.forEach(k => {
      const midY = (n.y + n.h + k.y) / 2;
      const p = document.createElementNS(NS, "path");
      const accent = n.kind === "root" ? "var(--gold-soft)" : accentOf(n);
      p.setAttribute("d", `M ${n.x} ${n.y + n.h} V ${midY} H ${k.x} V ${k.y}`);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", n.kind === "root" ? "var(--gold-soft)" : accent);
      p.setAttribute("stroke-width", n.kind === "root" ? 2 : 1.4);
      p.setAttribute("opacity", n.parked || k.parked ? .45 : .75);
      edges.appendChild(p);
    });
  });

  eachVisible(ROOT, n => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node" + (n.kind === "root" ? " root" : "") + (n.parked || n.kind === "parked" ? " parked" : "") + (n === selected ? " sel" : ""));
    g.setAttribute("transform", `translate(${n.x - n.w / 2},${n.y})`);
    const card = document.createElementNS(NS, "rect");
    card.setAttribute("class", "card");
    card.setAttribute("width", n.w); card.setAttribute("height", n.h); card.setAttribute("rx", 12);
    g.appendChild(card);

    let ty = PAD + 10.5;
    const id = textEl(n.id, 0, ty, "700 10.5px ui-monospace, Menlo, monospace", accentOf(n));
    g.appendChild(id);
    ty += 6;
    n.titleLines.forEach(l => {
      g.appendChild(textEl(l, 0, ty + 13, F_TITLE, n.kind === "root" ? "var(--gold)" : "var(--text)"));
      ty += 17;
    });
    if (n.specLines.length){
      ty += 4;
      n.specLines.forEach(l => {
        g.appendChild(textEl(l, 0, ty + 11.5, F_SPEC, n.parked || n.kind === "parked" ? "var(--dim)" : "var(--muted)"));
        ty += 15.5;
      });
    }

    if (n.collapsed && (n.children || []).length){
      const b = document.createElementNS(NS, "g");
      b.setAttribute("class", "badge");
      const r = document.createElementNS(NS, "rect");
      const label = "+" + n.children.length;
      const bw = 14 + label.length * 6.5;
      r.setAttribute("width", bw); r.setAttribute("height", 18); r.setAttribute("rx", 9);
      r.setAttribute("x", n.w - bw / 2); r.setAttribute("y", -9);
      const t = textEl(label, n.w + 7 - bw / 2 + 6.5, 4, "700 10px ui-monospace, Menlo, monospace", "var(--muted)");
      t.setAttribute("text-anchor", "middle");
      b.appendChild(r); b.appendChild(t);
      g.appendChild(b);
    }
    g.__node = n;
    nodes.appendChild(g);
  });
}

function textEl(str, x, y, font, fill){
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", PAD); t.setAttribute("y", y); t.setAttribute("font", font);
  t.setAttribute("fill", fill);
  t.textContent = str;
  return t;
}

function relayout(){
  layout(ROOT, 0);
  ROOT.x = 0;
  ROOT.y = 0;
  place(ROOT, ROOT.x - ROOT.subW / 2);
  render();
}

let tx = 0, ty = 0, s = 1, selected = null;
function applyView(){
  document.getElementById("world").setAttribute("transform", `translate(${tx},${ty}) scale(${s})`);
}
function fit(){
  let minX = 1e9, maxX = -1e9, maxY = 0;
  eachVisible(ROOT, n => {
    minX = Math.min(minX, n.x - n.w / 2);
    maxX = Math.max(maxX, n.x + n.w / 2);
    maxY = Math.max(maxY, n.y + n.h);
  });
  const W = innerWidth, H = innerHeight;
  s = Math.min(1, Math.min((W - 60) / (maxX - minX), (H - 130) / (maxY + 40)));
  tx = (W - (maxX - minX) * s) / 2 - minX * s;
  ty = 96 - 0 * s;
  applyView();
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderDetailText(root, text){
  const lines = (text || "").split("\n").map(l => l.trim()).filter(l => l.length);
  let listEl = null, preEl = null, para = [];
  const flushPara = () => { if (para.length){ root.appendChild(el("p", "pP", para.join(" "))); para = []; } };
  for (const l of lines){
    if (l.startsWith("```")){
      flushPara(); listEl = null;
      if (preEl) preEl = null;
      else { preEl = el("pre", "pPre"); root.appendChild(preEl); }
      continue;
    }
    if (preEl){ preEl.textContent += (preEl.textContent ? "\n" : "") + l; continue; }
    if (/^#{1,4}\s/.test(l) || /^\*\*[^*]+\*\*:?\s*$/.test(l)){
      flushPara(); listEl = null;
      root.appendChild(el("h4", "pH", l.replace(/^#+\s*/, "").replace(/\*\*/g, "").replace(/:$/, "")));
      continue;
    }
    if (/^[-•]\s+/.test(l)){
      flushPara();
      if (!listEl || listEl.tagName === "OL"){ listEl = el("ul", "pList"); root.appendChild(listEl); }
      listEl.appendChild(el("li", "", l.replace(/^[-•]\s+/, "")));
      continue;
    }
    if (/^\d+\.\s+/.test(l)){
      flushPara();
      if (!listEl || listEl.tagName === "UL"){ listEl = el("ol", "pList"); root.appendChild(listEl); }
      listEl.appendChild(el("li", "", l.replace(/^\d+\.\s+/, "")));
      continue;
    }
    if (l.startsWith("|")){
      flushPara(); listEl = null;
      if (/^\|[\s:|-]+\|$/.test(l)) continue;
      const cells = l.replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim()).filter(Boolean);
      if (cells.length) root.appendChild(el("div", "pRow", cells.join("   ·   ")));
      continue;
    }
    para.push(l);
  }
  flushPara();
}

function kidRow(k){
  const row = el("div", "pKid");
  const idEl = el("span", "pKidId", k.id);
  idEl.style.color = accentOf(k);
  row.appendChild(idEl);
  const body = el("div", "pKidBody");
  body.appendChild(el("div", "pKidTitle", k.title));
  if (k.spec) body.appendChild(el("div", "pKidSpec", k.spec));
  row.appendChild(body);
  row.addEventListener("click", () => openPanel(k));
  return row;
}

function ensureVisible(n){
  const panel = document.getElementById("panel");
  const rect = panel.getBoundingClientRect ? panel.getBoundingClientRect() : null;
  const pw = rect && rect.width ? rect.width : 0;
  const right = innerWidth - (pw > 40 ? pw : 0) - 44;
  const left = 44, top = 130, bottom = innerHeight - 60;
  const sx = tx + n.x * s;
  const sy = ty + (n.y + n.h / 2) * s;
  if (sx > right) tx -= (sx - right);
  if (sx < left) tx += (left - sx);
  if (sy < top) ty += (top - sy);
  if (sy > bottom) ty -= (sy - bottom);
  applyView();
}

function openPanel(n){
  if (!n) return;
  selected = n;
  render();
  applyView();

  const panel = document.getElementById("panel");
  const pathEl = document.getElementById("pPath");
  pathEl.innerHTML = "";
  const path = [];
  for (let a = n; a; a = a.parent) path.unshift(a);
  path.forEach((a, i) => {
    if (i) pathEl.appendChild(el("span", "pSep", " \u203a "));
    if (i === path.length - 1){
      pathEl.appendChild(el("span", "pCur", a.title));
    } else {
      const link = el("span", "pLink", a.title);
      link.addEventListener("click", () => openPanel(a));
      pathEl.appendChild(link);
    }
  });

  const idEl = document.getElementById("pId");
  idEl.textContent = n.id;
  idEl.style.color = accentOf(n);
  document.getElementById("pTitle").textContent = n.title;

  const body = document.getElementById("pBody");
  body.innerHTML = "";
  if (n.spec) body.appendChild(el("div", "pSpec", n.spec));
  if (n.detail){
    renderDetailText(body, n.detail);
  } else if (n.parent && n.parent.detail){
    body.appendChild(el("h4", "pH", "Context \u2014 " + n.parent.title));
    renderDetailText(body, n.parent.detail);
  }

  const kids = n.children || [];
  if (kids.length){
    body.appendChild(el("h4", "pH", "Contains \u2014 " + kids.length));
    const list = el("div", "pKids");
    kids.forEach(k => list.appendChild(kidRow(k)));
    body.appendChild(list);
  } else if (n.parent && (n.parent.children || []).length > 1){
    body.appendChild(el("h4", "pH", "Also in " + n.parent.title));
    const list = el("div", "pKids");
    n.parent.children.filter(k => k !== n).forEach(k => list.appendChild(kidRow(k)));
    body.appendChild(list);
  }

  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  panel.scrollTop = 0;
  ensureVisible(n);
}

function closePanel(){
  const panel = document.getElementById("panel");
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  if (selected){ selected = null; render(); applyView(); }
}

document.getElementById("pClose").addEventListener("click", closePanel);
addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

function nodeFromTarget(t){
  let el = t;
  while (el && el !== svg){
    if (el.__node) return el.__node;
    el = el.parentNode;
  }
  return null;
}

let drag = null;
svg.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false, node: nodeFromTarget(e.target) };
  svg.classList.add("dragging");
  try { svg.setPointerCapture(e.pointerId); } catch(_){}
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
  drag.moved = true;
  tx = drag.tx + dx;
  ty = drag.ty + dy;
  applyView();
});
svg.addEventListener("pointerup", () => {
  const d = drag;
  drag = null;
  svg.classList.remove("dragging");
  if (!d || d.moved) return;
  if (d.node) openPanel(d.node);
  else closePanel();
});
svg.addEventListener("pointercancel", () => { drag = null; svg.classList.remove("dragging"); });
svg.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){
    const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const px = e.clientX, py = e.clientY;
    tx = px - (px - tx) * k;
    ty = py - (py - ty) * k;
    s *= k;
  } else {
    tx -= e.shiftKey ? e.deltaY : e.deltaX;
    ty -= e.shiftKey ? 0 : e.deltaY;
  }
  applyView();
}, { passive: false });

document.getElementById("zoomIn").onclick = () => { const k = 1.2; tx = innerWidth/2 - (innerWidth/2 - tx) * k; ty = innerHeight/2 - (innerHeight/2 - ty) * k; s *= k; applyView(); };
document.getElementById("zoomOut").onclick = () => { const k = 1/1.2; tx = innerWidth/2 - (innerWidth/2 - tx) * k; ty = innerHeight/2 - (innerHeight/2 - ty) * k; s *= k; applyView(); };
document.getElementById("fitBtn").onclick = fit;
document.getElementById("maxBtn").onclick = () => {
  (function expand(n){ n.collapsed = false; (n.children || []).forEach(expand); })(ROOT);
  relayout(); applyView();
};
document.getElementById("minBtn").onclick = () => {
  (function collapse(n){
    if (n.depth >= 2 && (n.children || []).length) n.collapsed = true;
    (n.children || []).forEach(collapse);
  })(ROOT);
  relayout(); applyView();
};
addEventListener("dblclick", e => { if (e.target === svg) fit(); });
addEventListener("resize", () => { applyView(); });

let ROOT = DATA;
ROOT.collapsed = false;
relayout();
fit();
</script>
</body>
</html>
