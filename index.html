<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hormozi Harness — Full Tree</title>
<style>
  :root{
    --bg:#0d0e10; --panel:#14161a; --line:#262a31; --line-2:#31363f;
    --text:#e9e9e6; --muted:#9aa0a6; --dim:#6b7076;
    --gold:#c9a227; --gold-soft:#3a3213;
    --b1:#6ea8fe; --b2:#f2b880; --b3:#7bd88f; --b4:#d98fd9; --b5:#7fd1d9; --b6:#b0a0f0;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none;
    padding:16px 22px 12px;
    background:linear-gradient(180deg,rgba(13,14,16,.96) 55%,rgba(13,14,16,0));
  }
  header h1{margin:0;font-size:clamp(18px,2.6vw,26px);font-weight:800;letter-spacing:.02em}
  header h1 .tick{color:var(--gold)}
  header .sub{margin:4px 0 0;color:var(--muted);font-size:12px}
  header .sub strong{color:var(--text);font-weight:600}
  .toolbar{
    position:fixed;top:16px;right:18px;z-index:11;display:flex;gap:8px;align-items:center;
  }
  .toolbar button{
    height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);
    background:var(--panel);color:var(--text);font:600 12.5px/1 var(--mono);
    cursor:pointer;transition:.15s;
  }
  .toolbar button:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
  .toolbar button:active{transform:translateY(0)}
  .hint{
    position:fixed;left:22px;bottom:14px;z-index:10;color:var(--dim);
    font:500 10.5px/1.5 var(--mono);letter-spacing:.05em;pointer-events:none;
  }
  svg{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  svg.dragging{cursor:grabbing}
  .node{cursor:pointer}
  .node .card{fill:var(--panel);stroke:var(--line-2);stroke-width:1.25;rx:12;transition:stroke .15s}
  .node:hover .card{stroke:var(--gold)}
  .node.root .card{stroke:var(--gold-soft);stroke-width:1.5;fill:#17130d}
  .node.root:hover .card{stroke:var(--gold)}
  .node.parked .card{stroke-dasharray:4 4;fill:#111318}
  .badge rect{fill:#1d2026;stroke:var(--line-2)}
  .badge text{font:700 10px var(--mono);fill:var(--muted)}
  text{user-select:none}

  #panel{
    position:fixed;top:0;right:0;height:100vh;width:min(470px,94vw);
    background:#121418;border-left:1px solid var(--line-2);
    transform:translateX(103%);transition:transform .22s ease;
    z-index:30;overflow-y:auto;box-shadow:-30px 0 70px rgba(0,0,0,.55);
    padding-bottom:40px;-webkit-overflow-scrolling:touch;
  }
  #panel.open{transform:none}
  .phead{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:12px 20px;
    background:#121418;border-bottom:1px solid var(--line);z-index:2}
  .ppath{flex:1;font:600 10.5px/1.6 var(--mono);letter-spacing:.06em;color:var(--dim);
    text-transform:uppercase;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ppath .pLink{color:var(--muted);cursor:pointer;border-bottom:1px dotted var(--line-2)}
  .ppath .pLink:hover{color:var(--gold)}
  .ppath .pCur{color:var(--text)}
  #pClose{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);
    color:var(--muted);font:600 16px/1 var(--mono);cursor:pointer;flex:none}
  #pClose:hover{color:var(--gold);border-color:var(--gold)}
  #pTitleWrap{padding:18px 22px 4px}
  #pId{font:700 11px/1 var(--mono);letter-spacing:.14em}
  #pTitle{margin:8px 0 0;font-size:21px;font-weight:750;letter-spacing:.01em;line-height:1.3}
  #pBody{padding:6px 22px 30px}
  .pSpec{border-left:3px solid var(--gold-soft);background:#171a1f;border-radius:0 10px 10px 0;
    padding:12px 14px;margin:14px 0 16px;color:var(--text);font-size:13.5px;line-height:1.55}
  .pH{margin:20px 0 8px;font:700 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .pP{margin:10px 0;color:#cfd3d8;font-size:13.8px;line-height:1.65}
  .pList{margin:10px 0;padding-left:20px;color:#cfd3d8;font-size:13.5px;line-height:1.6}
  .pList li{margin:5px 0}
  .pPre{margin:10px 0;padding:11px 13px;background:#0f1114;border:1px solid var(--line);border-radius:10px;
    font:500 11.5px/1.6 var(--mono);color:#cfd3d8;white-space:pre-wrap}
  .pRow{margin:4px 0;padding:6px 9px;background:#15181d;border:1px solid var(--line);border-radius:8px;
    font:500 12px/1.5 var(--mono);color:#c8ccd2}
  .pKids{margin:8px 0 4px;display:flex;flex-direction:column;gap:8px}
  .pKid{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel);cursor:pointer;transition:.15s}
  .pKid:hover{border-color:var(--gold-soft);background:#171a1f}
  .pKidId{font:700 10.5px/1.6 var(--mono);white-space:nowrap}
  .pKidTitle{font-weight:650;font-size:13.5px;line-height:1.4}
  .pKidSpec{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
  .node.sel .card{stroke:var(--gold);stroke-width:1.7}
</style>
</head>
<body>
<header>
  <h1>Hormozi Harness — Full Tree <span class="tick">.</span></h1>
  <p class="sub">7 modules · 55 frameworks · 200 rules · every threshold from the vault &nbsp;·&nbsp; tap any node for the full breakdown</p>
</header>

<div class="toolbar">
  <button id="minBtn" title="Minimize — branches only">&minus;</button>
  <button id="maxBtn" title="Maximize — full tree">+</button>
  <button id="zoomOut" title="Zoom out">&minus;&times;</button>
  <button id="zoomIn" title="Zoom in">&plus;&times;</button>
  <button id="fitBtn" title="Fit to screen">FIT</button>
</div>

<div class="hint">drag to pan &nbsp;·&nbsp; scroll to move &nbsp;·&nbsp; &#8984;/ctrl + scroll to zoom &nbsp;·&nbsp; tap any node for details</div>

<svg id="stage"></svg>

<aside id="panel" aria-hidden="true">
  <div class="phead">
    <div class="ppath" id="pPath"></div>
    <button id="pClose" title="Close (Esc)">&times;</button>
  </div>
  <div id="pTitleWrap">
    <span id="pId"></span>
    <h2 id="pTitle"></h2>
  </div>
  <div id="pBody"></div>
</aside>

<script>
const DATA = {
  "id": "0",
  "title": "Hormozi Harness — Trunk",
  "kind": "root",
  "spec": "Value Equation drives every branch · LTGP:CAC ≥ 3:1 · payback ≤ 90 days (30 = excellent) · churn < 5%/mo · one vehicle, years not weeks.",
  "children": [
    {
      "id": "O",
      "title": "Offers — build the thing worth buying",
      "kind": "branch",
      "accent": 1,
      "spec": "Market > Offer > Persuasion. Value gap ≥ 10× price. Raise value before price.",
      "children": [
        {
          "id": "O.1",
          "title": "Value Equation",
          "spec": "(Dream × Likelihood) ÷ (Time × Effort). Divide, don't add. Collapse the denominator.",
          "children": [
            {
              "id": "O.1.1",
              "title": "Dream outcome ↑",
              "spec": "Status, specificity, identity, event anchor. Sell the after-state."
            },
            {
              "id": "O.1.2",
              "title": "Likelihood ↑",
              "spec": "Proof, lookalike testimonials, guarantees, named mechanism."
            },
            {
              "id": "O.1.3",
              "title": "Time ↓",
              "spec": "Front-load day-one win. Onboard in hours. Stage delivery."
            },
            {
              "id": "O.1.4",
              "title": "Effort ↓",
              "spec": "DFY, automation, templates. Remove steps and say so out loud."
            },
            {
              "id": "O.1.5",
              "title": "Score 1–10 each",
              "spec": "Index = (DO×PL)÷(T×E). Compare versions, re-score after every change."
            }
          ],
          "detail": "Value = (Dream Outcome × Perceived Likelihood of Achievement) ÷ (Time Delay × Effort & Sacrifice)\n\nTreat it as division, not addition. Growing the numerator scales value linearly; collapsing the denominator lets value run toward infinity. When two offers promise the same outcome, the dream outcome term cancels — then likelihood, time, and effort decide who wins.\n\n| Driver | Move | Levers |\n|---|---|---|\n| Dream Outcome | ↑ | status, specificity, identity, event anchor |\n| Perceived Likelihood | ↑ | proof, testimonials, guarantees, clear path, named mechanism |\n| Time Delay | ↓ | fast first win, quick onboarding, staged delivery |\n| Effort & Sacrifice | ↓ | DFY, automation, templates, removing steps, reframing |\n\nApply it:\n1. Write the offer in one sentence.\n2. Score all four drivers 1–10. Score benefits so higher is better; score time and effort so higher means slower/harder (worse).\n3. Compute the index: (DO × PL) ÷ (T × E). Use it to compare versions, not to claim precision.\n4. If the dream outcome is vague, fix that first. Otherwise attack the bottom of the equation.\n5. Re-score after every change and keep the version with the highest index.\n\nHow to move each term:\n- Dream outcome up: attach a number, a deadline, and an identity (\"look like the fittest dad at the reunion\"). Sell what changes after the result, not the result alone.\n- Likelihood up: show proof for people who look like this buyer; show the exact path; add a guarantee; explain the mechanism so success feels mechanical, not lucky.\n- Time down: front-load a win into day one; onboard in hours, not weeks; stage delivery so the first useful thing arrives immediately; make payment feel like the start of progress.\n- Effort down: remove steps, pre-build assets, do the hard part for them, automate the boring part, and tell them what you removed.\n\nPerception is reality: a shorter wait the buyer cannot see earns you nothing. Say each improvement out loud in the pitch. Beginners inflate claims; strong operators delete friction. Speed beats free — a paid result now usually beats a free result later. Push time and effort toward zero and value becomes unbounded."
        },
        {
          "id": "O.2",
          "title": "Market selection — starving crowd",
          "spec": "Channel demand that exists. Refuse below 7/10 on any criterion.",
          "children": [
            {
              "id": "O.2.1",
              "title": "Four criteria ≥ 7/10",
              "spec": "Massive pain · purchasing power · easy to target · growing."
            },
            {
              "id": "O.2.2",
              "title": "Evergreen pools",
              "spec": "Health, wealth, relationships. Pick the fastest-growing sub-niche."
            },
            {
              "id": "O.2.3",
              "title": "Niche ladder",
              "spec": "Narrow until ~$10M/yr. Same product up to ~100× price positioned narrowly."
            },
            {
              "id": "O.2.4",
              "title": "Commit 6+ months",
              "spec": "Switching before compounding = the most common self-inflicted death."
            }
          ],
          "detail": "- Order of leverage: Market > Offer > Persuasion. A great offer aimed at the wrong crowd loses to a mediocre offer aimed at a starving one. Channel demand that already exists instead of trying to manufacture it.\n- Score four criteria 1–10 each: Massive pain (urgent, bleeding now), Purchasing power (can pay today without saving up), Easy to target (findable via communities, platforms, events, ads), Growing (demand tailwind, not decline).\n- Evergreen demand pools: Health, Wealth, Relationships. Stand inside one, then pick its fastest-growing sub-niche.\n- Niche ladder example: \"help people lose weight\" → \"help people over 40 lose weight\" → \"help women over 40 lose weight\" → \"help female executives over 40 lose weight without giving up wine.\" Each rung lowers competition, sharpens targeting, and supports a higher price.\n- Niche math: the same product positioned narrowly can command up to ~100× more than the broad version. Under roughly $10M/year, keep niching. Beyond that, broaden per TAM.\n- Commit for 6+ months before judging. Switching niches before compounding sets in is the most common self-inflicted death.\n- Pain is necessary but insufficient. The buyer must know the problem exists, believe it is solvable, and believe you specifically can solve it.\n\nScore the niche on a simple grid before committing:\n\n| Criterion | 1–3 (fail) | 7–10 (commit) |\n|---|---|---|\n| Massive pain | mild inconvenience | urgent, weekly, bleeding |\n| Purchasing power | cannot pay without strain | already spends on the problem |\n| Easy to target | \"everyone\" | named communities, lists, events |\n| Growing | declining demand | demand tailwind, new buyers arriving |\n\nQuestions that surface the right niche fast: who is the easiest person you can help right now? Who already knows they have this problem? Who feels it weekly rather than someday? Who has already tried and failed at other solutions? Who can pay without a long education? Whoever scores highest across those answers is your first market — not the largest market you can imagine, the most reachable one you can serve today."
        },
        {
          "id": "O.3",
          "title": "Dream outcome",
          "spec": "[Result] + [timeframe] + [without the pain]. Sell the beach, not the plane.",
          "children": [
            {
              "id": "O.3.1",
              "title": "Five moves",
              "spec": "After-state in their words → number + deadline → remove feared cost → identity."
            },
            {
              "id": "O.3.2",
              "title": "Four silent questions",
              "spec": "What do I get · how do I know · how long · what do I do. Answer all four."
            },
            {
              "id": "O.3.3",
              "title": "Status is strongest",
              "spec": "Outcomes that change how others see the buyer outpull raw utility."
            }
          ],
          "detail": "- Sell the destination, not the vehicle. \"Gym membership\" is the vehicle; \"lose 20 lbs in 6 weeks\" is the destination.\n- Formula: [specific result] + [short timeframe] + [without the pain they fear].\n- Build it in five moves: ask what they most want; write it as a visible after-state in their own words; attach a number and a deadline; append the feared cost you remove; tie it to an identity, event, or status shift.\n- Weak: \"grow your brand.\" Strong: \"book 3 premium clients in 30 days without cold outreach.\"\n- Not a dream outcome: features (\"AI analytics dashboard\"), deliverables (\"ten reports a month\"), or vehicles (\"a six-week program with daily videos\"). All three describe the plane, not the beach.\n- Is a dream outcome: \"know which post will go viral before you publish,\" or \"get ten paying customers in 30 days without messaging strangers.\"\n- Prospects silently ask four questions — what do I get, how do I know it will happen, how long will it take, what do I have to do. Answer all four inside the offer and the copy.\n- Status is the strongest upgrade: outcomes that change how others see the buyer outpull raw utility. When unsure between two framings of equal effort, pick the one with the higher status shift."
        },
        {
          "id": "O.4",
          "title": "Grand Slam assembly",
          "spec": "10 steps. An offer that cannot be line-item compared.",
          "children": [
            {
              "id": "O.4.1",
              "title": "Obstacle map 10–15+",
              "spec": "Before purchase, during use, after result, social. Tag each to a VE term."
            },
            {
              "id": "O.4.2",
              "title": "Reverse into named solutions",
              "spec": "“How to ___” becomes “The 5-Minute Meal Mastery System.”"
            },
            {
              "id": "O.4.3",
              "title": "Trim & stack",
              "spec": "Cut high-cost/low-value first. Total value dwarfs the price."
            },
            {
              "id": "O.4.4",
              "title": "Then the enhancers",
              "spec": "Scarcity, urgency, bonuses, guarantee. Name with MAGIC. Launch, over-deliver."
            }
          ],
          "detail": "A Grand Slam Offer cannot be line-item compared against a rival, combines an attractive promotion with a premium price and a guarantee that removes risk, and pays for customer acquisition through its money model. Build in this order:\n1. Pick the market. Score the four criteria; refuse to proceed below 7/10 on any of them.\n2. Commit to premium pricing before designing anything. Price signals position as much as it captures it.\n3. State the dream outcome using the destination formula.\n4. List every problem the buyer faces on the way there — before buying, during use, after getting the result, and how others will perceive them. Go granular; a weight-loss buyer has meal-prep problems, grocery problems, eating-out problems, and plateau problems. Aim for 10–15+ obstacles. Tag each to the value-equation term it damages.\n5. Reverse each problem into a named solution: \"How to ___\" becomes a component with its own identity. \"Meal planning help\" becomes \"The 5-Minute Meal Mastery System.\"\n6. Pick a delivery vehicle for each solution (see the delivery cube).\n7. Trim: cut high-cost/low-value first, then low-cost/low-value offerings.\n8. Stack survivors into one deliverable that handles every named problem. Price each component; the total value must dwarf the price and the bundle must be impossible to comparison-shop.\n9. Add scarcity, urgency, bonuses, and a guarantee.\n10. Name it with MAGIC.\n11. Launch, over-deliver even unscalably, collect cash, then systematize. Create flow first, monetize it, and only then add friction.\n\nSweep four problem territories at step 4 so nothing hides: before purchase (trust, risk, skepticism from past failures), during use (confusion, awkward steps, time cost), after the result (maintenance, relapse, next plateau), and social (what family, peers, or clients will think). Tag each obstacle to the value-equation term it damages — that tag dictates which lever fixes it, and it stops you from writing solutions that solve nothing the buyer actually fears."
        },
        {
          "id": "O.5",
          "title": "Delivery vehicles — the cube",
          "spec": "Attention × effort × medium × speed. 1-to-many is the sweet spot.",
          "children": [
            {
              "id": "O.5.1",
              "title": "10× test",
              "spec": "What would you deliver at 10× the price? That is the premium tier."
            },
            {
              "id": "O.5.2",
              "title": "1/10th test",
              "spec": "How to make it MORE valuable at 1/10th. Usually 1:many or software → low tier."
            },
            {
              "id": "O.5.3",
              "title": "Trim quadrant",
              "spec": "High-cost/low-value cut first. Low-cost/high-value keep and scale."
            }
          ],
          "detail": "Decide how each solution ships by walking the cube:\n- Attention: 1-on-1 / small group / one-to-many\n- Effort shifted: DIY / done-with-you / done-for-you\n- Medium: live or recorded; audio, video, or written\n- Response speed: async, scheduled, on-demand\n- 10× test: what would you deliver if you charged 10×? Deliver that at premium tiers.\n- 1/10th test: paid one-tenth, how would you make it more valuable? Usually one-to-many or software. That becomes your low tier.\n\nTrim and stack by cost-to-value quadrant:\n\n| | High value | Low value |\n|---|---|---|\n| Low cost | Keep and scale — one-to-many lives here | Cut second |\n| High cost | Keep for premium tiers | Cut first |\n\nDelivery menu to draw from when assigning vehicles: written tutorials and swipe files; templates, checklists, and frameworks; live calls and async support; communities; audits; workbooks; dashboards and automations; done-for-you assets; and simple software tools. Each carries a different cost-to-value ratio; prefer formats that feel high-touch but scale (automations and dashboards over endless live calls).\n\nOne-to-many with near-zero marginal cost and high perceived value is the sweet spot. Walk the sales-to-fulfillment continuum deliberately: start hands-on to win results and proof, then productize toward group and recorded formats as cash allows. Never let delivery format be chosen for your convenience over the buyer's outcome."
        },
        {
          "id": "O.6",
          "title": "Bonus stacking",
          "spec": "Same value reads larger itemized. Sum of bonuses > core price.",
          "children": [
            {
              "id": "O.6.1",
              "title": "Each bonus kills one objection",
              "spec": "Benefit-driven names, standalone value proven, priced."
            },
            {
              "id": "O.6.2",
              "title": "Objection → bonus map",
              "spec": "No time → fast-start DFY · complicated → checklist · trust → proof asset."
            },
            {
              "id": "O.6.3",
              "title": "Never discount the core",
              "spec": "Add a bonus instead. Reveal bonuses after the yes as rewards."
            }
          ],
          "detail": "Split one offer into priced parts and present them stacked — the same value reads as far larger when itemized. Rules:\n- Give every bonus a benefit-driven name, never \"bonus videos.\"\n- Tie each bonus to one specific objection it kills (time, complexity, trust, failure risk).\n- Explain how you built it and why it exists.\n- Prove its standalone value: what it costs elsewhere, what it saves, what it replaces.\n- Paint the usage moment so the buyer sees themselves applying it.\n- Ascribe and justify a dollar value, then show the sum.\n- Tools, templates, and checklists beat trainings.\n- Solve the buyer's next problem, not just the current one.\n- The summed bonus value should eclipse the core price on its own.\n- Attach scarcity or a deadline to at least one bonus.\n- Keep the stack clean: cut any bonus that adds confusion or does not support the core outcome.\n- Optional: license other people's products as bonuses by negotiating a bulk discount plus an affiliate commission back to you.\n\nOrder the stack by biggest objection first, highest perceived value early, logical progression, and varied formats. On a call, ask for the sale first; reveal bonuses after the yes as rewards. If the answer is no, present the bonus that answers the stated objection and ask again. Never discount the core to close — discounting teaches buyers to negotiate. Add a bonus instead.\n\nObjection → bonus map you can reuse:\n\n| Objection | Bonus that kills it |\n|---|---|\n| \"No time\" | fast-start guide, done-for-you setup, pre-built templates |\n| \"Too complicated\" | step-by-step checklist, plug-and-play swipe file |\n| \"Won't work for me\" | 1-on-1 audit, case study library from similar buyers |\n| \"I might fail / fall off\" | accountability channel, live check-ins, community |\n| \"Too expensive\" | high-value tool that visibly replaces a paid service |\n| \"I don't trust you yet\" | proof asset, trial component, conditional guarantee upgrade |\n\nAlso look for the hidden belief under the stated objection. \"I'll think about it\" usually means trust is missing; \"no time\" usually means the effort looks heavy. Fix the belief, not just the sentence."
        },
        {
          "id": "O.7",
          "title": "Guarantees",
          "spec": "“If you don't get X in Y, we will Z.” Decide on net math, not fear.",
          "children": [
            {
              "id": "O.7.1",
              "title": "Unconditional",
              "spec": "Full refund, no questions, 30/60/90 days. Low-ticket B2C."
            },
            {
              "id": "O.7.2",
              "title": "Conditional",
              "spec": "Tied to required actions. Filters non-implementers; feels stronger."
            },
            {
              "id": "O.7.3",
              "title": "Anti-guarantee",
              "spec": "All sales final + compelling reason-why. Consumables, heavy proof."
            },
            {
              "id": "O.7.4",
              "title": "Performance",
              "spec": "No-results-no-pay, revenue share. High-ticket services with trust."
            },
            {
              "id": "O.7.5",
              "title": "Refunds < 5%",
              "spec": "Above that fix delivery and onboarding before scaling acquisition."
            }
          ],
          "detail": "Risk is the number-one objection. State the guarantee boldly, give it a reason-why, and give it teeth: \"If you don't get X in Y, we will Z.\"\n- Unconditional: full refund, no questions, 30/60/90 days. Strongest trust signal, highest refund exposure. Best for low-ticket B2C.\n- Conditional: tied to required success actions. Feels stronger because it implies confidence and filters out non-implementers. Upgrades: double or triple refund, keep-working-free until the result lands, credit toward another program, coverage of ancillary costs, pay-their-wage.\n- Anti-guarantee: all sales final with a compelling reason-why. Works for consumables, downloads, and once-seen content — and only with serious proof.\n- Implied / performance: revenue share, profit share, or no-results-no-pay. Best alignment when outcomes are measurable and mutual trust exists.\n\nStack them: \"Try 30 days. Complete the program, see no result, and you get every dollar back and keep the bonuses.\" Decide on net math, not fear. Typical refund rates sit under ~5%; compare refund cost plus fulfillment cost against the conversion lift, and tighten conditions before removing the guarantee. Match type to economics: high fulfillment cost favors conditional, anti, or performance; low-ticket digital favors unconditional; mid-ticket cohorts favor conditional with required actions; high-ticket services favor performance or partial-refund structures. Name every guarantee vividly. A guarantee is an enhancer — it cannot rescue a product that fails people."
        },
        {
          "id": "O.8",
          "title": "Scarcity & urgency",
          "spec": "Fear of loss moves harder than promise of gain. Real limits only.",
          "children": [
            {
              "id": "O.8.1",
              "title": "Scarcity = quantity",
              "spec": "Limited seats, limited bonuses, never-again windows. Advertise real capacity."
            },
            {
              "id": "O.8.2",
              "title": "Urgency = time",
              "spec": "Cohort dates, seasonal wrappers, expiring price or bonus."
            },
            {
              "id": "O.8.3",
              "title": "50–60% close in final hours",
              "spec": "No spike = deadline not believed. Announce the sellout — it is proof."
            },
            {
              "id": "O.8.4",

              "spec": "~1 in 5 buyers pays ~5×. Leave room for the premium path."

          ],
          "detail": "Raise perceived demand and lower perceived supply. Fear of loss moves harder than promise of gain. Hormozi Law: the longer you delay the ask, the bigger the ask you can make.\n- Scarcity (quantity): limited seats or slots, limited bonuses, never-again windows. For services: total-business cap, growth-rate cap, or cohort cap.\n- Urgency (time): cohort start dates, rolling seasonal wrappers (same offer, new named wrapper — strongest for local), expiring price or bonus, genuine decaying opportunity.\n- Expect 50–60% of sales in the final hours of a deadline. When you sell out, announce it — the sellout itself is proof.\n- Demand is fractal: roughly 1 in 5 buyers pays about 5×. Keep supply under demand and leave room for the premium path.\n- Concrete mechanisms that stay honest: cap the cohort and publish the count (\"20 spots, 17 claimed\"); open enrollment only when a new cohort starts; name each seasonal wrapper while the core stays the same; expire the price or the bonus, never the service the buyer already owns; sell against a real decaying opportunity such as locked-in rates or a closing window.\n- Ethical limits: advertise only real remaining capacity; deadlines must actually expire. Fake scarcity destroys trust permanently. When an offer fatigues, refresh the wrapper before the machine — change creative first, then body copy, headline/wrapper, duration, enhancer, and price last; go only as deep as needed."

              "spec": "Outcome → worth in money/time/pain → alternatives → full stack → price as fraction."

          ],
          "detail": "- Price on delivered value, not cost-plus. Commodities compete on price and race to the bottom; differentiation escapes the comparison.\n- Anchor two ways: the buyer's perceived gap should be 10× to 100× between stacked value and price; and you can charge up to ~100× direct cost while still being a steal.\n- Virtuous Cycle of Price: higher price → more emotional investment → better results → more proof → more demand → higher price. Cutting price runs the loop backward. Price should sting; those who pay the most pay the most attention.\n- Match the delivery model: DIY sits low and volume-based, DWY mid, DFY premium.\n- Tiers: Entry (DIY), Core (DWY), Premium (DFY). Engineer clear value jumps, make the middle tier the obvious pick, and let the top tier anchor it.\n- Psychology: charm pricing (27/97/297) under ~$300; round numbers for premium tiers ($1,000+); show the highest anchor first.\n- Write the justification story in five beats: restate the outcome → quantify what it is worth in money gained, time saved, or pain avoided → compare against alternatives → anchor the full stack → reveal the price as a fraction of value.\n- Raise price only after raising value. Being the most expensive carries strategic benefit; being second-cheapest carries none.\n- Raise when: demand exceeds capacity, close rates are high without price flinching, refunds are low, and the extra margin funds better delivery. Test on new cohorts and grandfather existing buyers.\n- Use payment plans to lower the entry barrier, never to lower the price. Chargebacks aside, a discount is a permanent education in negotiability.\n- Experiments to run in order: A/B the price point on new cohorts, test a payment plan against a single payment, test a bonus versus a discount of equal cost, test early-bird pricing against a hard deadline, and test tier framing (which tier is presented as the default). Change one variable at a time and judge on cash collected, not units sold."

          "detail": "Every way to advertise fits one box:\n\n| | Your audience (warm) | Other people's audience (cold) |\n|---|---|---|\n| 1-to-1 (private) | Warm outreach | Cold outreach |\n| 1-to-many (public) | Post free content | Run paid ads |\n\n- Warm = people who gave you permission to contact them. Cold = strangers. The difference in execution is trust.\n- Lead = anyone you can contact. Engaged lead = someone who shows interest (replies, follows, gives info, raises a hand). Optimize for engaged leads, not raw names.\n- First move: advertise the core offer directly. Build a lead magnet only when the offer is expensive, complex, or has a long decision cycle.\n- Channel selection:\n  - $0 budget, no audience, fastest path to first sale → warm outreach.\n  - Some audience, limited budget, want compounding → post free content.\n  - B2B, high-ticket, no audience, list available → cold outreach.\n  - Proven offer plus budget, want scale → paid ads (do this last).\n- Master one before adding another. Most operators run all four badly instead of one well. If leads are short, the problem is almost never \"wrong strategy\" — it's insufficient skill or insufficient volume in the channel you already picked.\n- When you max a channel, add the next one in this order: warm outreach → content → cold and/or paid.\n- Four Lead Getters (leverage — other people advertise for you): customer referrals (cheapest, highest quality), employees (recruit with the Internal Core Four; train with Document, Demonstrate, Duplicate), agencies (use to learn a method on a deadline, then take it in-house), affiliates/partners (highest leverage; pay 25% / 50% / 100% of max CAC on agree / activate / sustain).\n- Check referrals > churn. Aim for ≥25% of new business from referrals."

          "detail": "A lead magnet is a complete solution to a narrow problem. Solving it exposes the next problem — the one your core offer fixes. Someone who pays with time now is more likely to pay with money later. Give away the secrets; sell the implementation.\n\nThree types\n1. Reveal Their Problem — diagnosis, audit, assessment, quiz.\n2. Samples & Trials — short version of the core offer.\n3. One Step of a Multi-Step Process — solve one stage so the rest becomes obvious.\n\nFour delivery methods — Software/Tool · Information (PDF, video, checklist, training) · Services · Physical product. Three types × four deliveries = up to 12 versions; build the ones your audience will actually consume.\n\nSeven-step creation process\n1. Pick the narrow, meaningful problem and exactly who has it. It must sit one step before your core offer.\n2. Choose how to solve it (pick one of the three types).\n3. Choose delivery (pick a method; make a few versions).\n4. Test the name. Headline beats image beats subheadline. Name the outcome, not the format: \"5-Minute Close-Rate Doubler,\" not \"Free PDF.\"\n5. Make it easy to consume — finish in one sitting, in every format, value delivered in minutes.\n6. Make it darn good — good enough that you could charge for it.\n7. End with a CTA.\n\nCTA formula: what to do (clear, single action) + a reason to act now — real scarcity, real urgency (deadline or expiring bonus), and a because-reason. Don't stack multiple CTAs.\n\nMath: advertising a free lead magnet instead of the core offer can produce roughly 10× the engaged leads at the same spend (about 3× lower CAC)."

          "detail": "Trust is the only real difference from warm outreach. You must deliver Big Fast Value — blow their mind in under 30 seconds and give away things people normally pay for.\n\nList building: software tools → list brokers → elbow grease (manual research). Build the first 1,000 by hand. Quality of list beats cleverness of copy.\n\nVolume benchmarks\n- Cold email: 100–200/day after warming up domain infrastructure. Aim ~3% engaged replies.\n- Cold DM: 30–50/day, more personalized per message.\n- Cold calls: 50–100 dials/day → roughly 3–5 real conversations. Phone math: ~20% pickup × ~25% take-rate ≈ 4 customers per 100 calls.\n- Floor: lifetime gross profit to CAC (LTGP:CAC) ≥ 3:1. Below that, fix the model or the offer before scaling volume.\n\nMessage structure\n1. Targeted list with criteria matching the ideal customer.\n2. Personalized opener: reference their company, content, recent news, or a specific situation detail.\n3. Lead with a free, specific resource — not a pitch. \"I built [specific tool/checklist] for [ICP] that [specific outcome]. Given [signal about them], want me to send it over?\"\n4. Short: 3–5 sentences, one idea, one CTA, written at a third-grade reading level (tested ~50% more replies).\n5. Guarantee opener as a stronger variant: \"I'll [specific outcome] in [timeframe] — if not, you pay nothing.\"\n\nFollow-up\n- Follow up 5–7 times. Most replies arrive on touches 3–5. Space them 2–4 days apart.\n- Sequence that works: message 1 gives a resource, no ask → message 2 (2 days later) asks a question about their situation → message 3 (3 days later) breaks up and leaves another free resource.\n- Multi-channel: email → social connection → DM → comment on their post → email with a new angle → break-up. Never send \"just checking in.\"\n- Every follow-up needs a new angle: new proof, new resource, new insight, new question, or genuine urgency.\n- On reply, use A-C-A and never ask to book a call on the first reply. Get a micro-yes first.\n- Re-run the same list every 3–6 months with a fresh angle; automate delivery and distribution so volume doesn't depend on memory.\n\nPlatform DM norms\n- LinkedIn: professional, insight-led, specific to their business.\n- Instagram DM: short, casual, reference their content, no walls of text.\n- Facebook: community feel, shared groups or mutual connections.\n- Email: longer is acceptable; subject line is the critical element.\n- X/Twitter DM: very short, one point, decide on a link before sending."

          "detail": "Run ads last, after the offer converts in warm or cold channels.\n\n- Platform: choose where your customers already are (Meta for B2C, LinkedIn for B2B, Google for intent, YouTube for education).\n- Targeting: build lookalikes from your best customers first, then test warmer and colder audiences. More filters = more efficient spend but audiences burn out faster.\n- Ad anatomy — Callout + Value + CTA:\n  - Callout devices: labels, yes-questions, if-then statements, ridiculous results, contrast, likeness.\n  - Value = What-Who-When: what they get, who it's for, when they get it. Walk the prospect through past, present, and future; show status change through other people's eyes.\n  - CTA = exact next step + real scarcity, urgency, or bonus.\n- Landing page: continue the ad's experience. The ad's job is the click; the page's job is the conversion. Mismatch kills conversions.\n- Hook-first: ~80% of ad performance lives in the hook/creative. Test 5–10 hook variations per concept, always, even while winners run.\n- Production math: 50 hooks × 3–5 meat variations × 1–3 CTAs = 150–750 ad variants per week.\n- Four ad types to rotate: direct response, content/value, social proof, pattern interrupt.\n\nBudget rules\n- Three phases: Track (instrument everything) → Lose (treat spend as investing in a money-printing machine; test budget = 2× your 30-day cash; kill at 1× if zero leads came in) → Print (reverse-engineer from the customer goal, then pad ~20%).\n- Kill any ad that exceeds 2× your target cost-per-lead without converting. Judge only after 20–50 leads.\n- Scale winners by ~20% per day max; bigger jumps reset the learning phase.\n- LTGP:CAC ≥ 3:1. If CAC sits below 3× industry average, fix the business model; if above, fix the ads.\n- Client-Financed Acquisition: recover acquisition + fulfillment cost within 30 days via an upsell so customers fund their own acquisition. Use the upsell to close the gap, not a smaller ad budget.\n- Don't confuse a sales problem with an advertising problem: check whether engaged leads actually have the problem you solve and the money to buy."

          "detail": "The audience is the compounding asset. Content is advertising you don't pay per impression.\n\n- Content Unit = Hook (topic + headline + format) + Retain (curiosity via lists, steps, stories) + Reward (value per second). Nothing is too long — only too boring.\n- Give:ask ≥ 3:1. Best mode: give until they ask. Give in public, ask in private.\n  - Integrated ask: a CTA in every piece.\n  - Intermittent ask: offer roughly every 11th piece.\n- Posting system: one long-form piece per week (YouTube, podcast, newsletter) → chop into 7+ short-form pieces (Reels, Shorts, TikToks, threads, LinkedIn posts) → adapt to each platform → post daily where your buyers are.\n- Consistency beats virality. One post per day for a year outperforms one lucky viral hit.\n- Repurpose the same message across platforms, adjusted for format — don't create from scratch for each channel.\n- Narrow first: puddles → ponds → lakes → oceans. Own one specific audience before broadening.\n- Depth-then-width or width-then-depth — pick one and run it; don't drift between the two.\n- Say \"How I,\" not \"How to.\" Document what you actually do; don't manufacture content.\n- Content types that build trust fastest: results you got (with proof), mistakes you made (with lessons), process you follow (step by step), opinions that polarize (a real stance).\n- Manual beats pre-scheduled. Post in the moment where the platform rewards it; avoid blaming short attention spans for weak hooks."

          "detail": "A hook is a compressed value equation — it raises perceived outcome and belief while lowering time and effort. Hook = Pattern Interrupt + Promise of Value. It has two parts: the callout that grabs attention and the promise that pays it off.\n\nCore formula: WHO + RESULT + SPEED/EASE + OBJECTION REMOVAL.\nExample shape: \"Coaches: get 3 clients this week without ads.\"\n\nHook families\n- Outcome: Get [result].\n- Time-based: Get [result] in [time].\n- Effort reduction: Get [result] without [pain or sacrifice].\n- Callout: If you are [audience], this is for you.\n- Proof / \"How I\": How I [achieved result] in [time] without [pain].\n- Contrarian: [Common belief] is wrong.\n- Pain: If you struggle with [pain], read this.\n- Mechanism: The [system] that gets you [result].\n- Transformation: From [bad state] to [desired state].\n- Story: I was [negative state] until [event].\n- Direct: Want [outcome]? Read this.\n- Contrast: Stop [common action]. Start [better action].\n- Question: Why do most [audience] never [outcome]?\n- Hybrid: combine WHO + RESULT + TIME + WITHOUT X (best performers).\n\nRules\n- Lead with the result, not the topic.\n- Add numbers, constraints, timeframes. Specific beats general every time.\n- Kill objections inside the hook: \"even if…\", \"without…\", \"no experience needed.\"\n- One idea per hook, short sentences, no clever wordplay. Clarity over creativity.\n- Hooks should attract buyers, not just clicks. If it doesn't promise something useful, rewrite it.\n\nProcess\n1. Write 20+ variations per piece (50 if you can).\n2. Pick the top 3–10 on specificity, clarity, relevance, and outcome strength.\n3. Test as titles, subject lines, or opening lines.\n4. Keep the pattern that wins; add it to a swipe file.\n5. Repeat weekly: write 50, select 10, build variations, launch, analyze, double winners and kill losers, document learnings.\n6. Add specificity when generic; add speed when decisions feel slow; add ease when effort feels high; add a callout when the audience is broad; add contrast when value isn't obvious."

          "detail": "Use these in order. This is the antidote to the Size-of-the-Pie Fallacy — believing a bigger market exists instead of doing more of what works.\n\n- More — Rule of 100: 100 primary actions per day for 100 days (100 reach-outs, 100 dials, 100 minutes of content, $100/day of ads).\n- Better — fix the constraint: find the biggest drop-off in the funnel and improve only that. Test one thing per week per platform. Abandon a constraint after 4 tries or 1 month, then move to the next biggest.\n- New — only after More and Better are exhausted: new placement → new platform → new activity.\n- Open to Goal: commit to the outcome regardless of how long it takes. Expect 3–6 months to crack a new source; stick with one pick for years.\n- Reinvest a fixed percentage of revenue into testing every month."

    {
      "id": "M",
      "title": "Money Models — the sequence of offers",
      "kind": "branch",
      "accent": 3,
      "spec": "Attraction → core → upsell → downsell → continuity. 30-day cash rule.",
      "children": [
        {
          "id": "M.1",
          "title": "The stack — five positions",
          "spec": "Optimize the sequence, not a single offer.",
          "children": [
            {
              "id": "M.1.1",
              "title": "Attraction",
              "spec": "Stranger → first buyer. Aim at the biggest barrier: price, trust, time, risk."

            {

              "title": "Core",

          "detail": "A money model is the deliberate sequence of offers you make: what you sell, in what order, at what price, and at what moment. Optimize the sequence, not a single offer. Five positions:\n\n1. Attraction — turns a stranger into a first-time buyer. Aim it at the biggest barrier to the first purchase: price, trust, time, or risk.\n2. Core — the main thing the buyer came for. The attraction offer leads directly into it.\n3. Upsell — whatever you offer right after the core purchase, while attention and trust peak. Most profit usually lives here.\n4. Downsell — the alternate path for every no. Never the same product cheaper; change how they pay or what they get.\n5. Continuity — the recurring layer that keeps revenue turning after the transaction ends. Build it last.\n\nMap the whole catalog on the Value Grid — price on one axis (low → high), purchase frequency on the other (one-time → recurring):\n\n|  | One-time | Recurring |\n|---|---|---|\n| Low price | Tripwire / attraction | Entry continuity |\n| High price | High-ticket core | Premium continuity |\n\nFill empty quadrants in order of ease, not order of excitement. Every layer should hand the buyer a clear next step.\n\nTwo numbers decide whether the stack works: cash collected within 30 days per customer, and gross profit per customer over the full relationship. Track both after every offer you add. If an addition raises lifetime value but slows 30-day cash below the payback line, it belongs later in the sequence than you placed it."
        },
        {
          "id": "M.2",
          "title": "Attraction offers — 5 types",
          "spec": "Match the type to the first-purchase barrier.",
          "children": [
            {
              "id": "M.2.1",
              "title": "Win Your Money Back",

          ],
          "detail": "Free and discounted are points on one continuum, not opposites. Free pulls volume; discounts pull higher show-up rates. Choose by the barrier that blocks the first purchase.\n\n1. Win Your Money Back — The buyer pays, then earns a refund by hitting stated criteria: do X in Y within Z, under clear rules. Qualify by results, actions, or both. Criteria must be easy to track, tied to a real result, and worth advertising. Profit comes from the winners who keep buying — this fails without an upsell ready behind it. Deliver refunds as store credit drawn down as a monthly discount, never as free months. Only run it when your refund rate sits under 5%.\n2. Giveaway — Run an entry contest where the grand prize is the exact product you want everyone to buy. One winner takes it; every other entrant gets a time-limited promotional offer. Value-anchor the prize, create urgency at three points (entering, claiming, using), and keep the discount within 10–30% of gross margin. Queue downsells for non-winners. If it flops, the prize wasn't grand enough. Check sweepstakes law — this type is regulated.\n3. Decoy — Advertise a stripped or cheaper version, then place it beside a premium option. Present the premium first, make the contrast dramatic, sell outcomes instead of feature lists, and ask whether they came for the free thing or the lasting result. Discount offers show better attendance than free offers — use them where no-shows are expensive. Test four ways to state the discount: percent off, dollars off, free portion, total package.\n4. Buy X Get Y Free — Turn a discount into a bundle giveaway by selling multiples. Raise the base price before you give anything away. Give away more units than they pay for; several cheap free items can beat one expensive one. Lengthens the commitment window and pulls prepaid cash forward. Cap it near 10% of customers when using it purely for a cash pop.\n5. Pay Less Now or Pay More Later — Offer a choice: full price later (delayed payment, conditional guarantee, card on file) or less today (20–50% off plus bonuses). Removes price risk at the decision moment and lets you advertise without fear. If more than 10% of the pay-later group cancels, the offer was too weak.\n\nMatch the type to the barrier: cash risk → Pay Less Now; trust → Win Your Money Back; attention → Giveaway; sticker shock → Decoy or Buy X Get Y.\n\nBefore committing, grade each candidate attraction offer on four questions: does it pull the target buyer specifically, does it leave enough cash to fund 2+ future acquisitions, does it have an obvious next purchase to hand into, and can you operate it without heroics? Two no answers means pick a different type. A pure free-goodwill offer (no cash, no next step) is a lead magnet, not an attraction offer — don't confuse the two."
        },
        {
          "id": "M.3",
          "title": "Upsells — 4 types",
          "spec": "The customer's next problem, solved at peak appetite.",
          "children": [
            {
              "id": "M.3.1",
              "title": "Classic",
              "spec": "Hyper Buying Cycle. BAMFAM. Three price options → middle wins."

            {
              "id": "M.3.2",
              "title": "Menu",
              "spec": "Unselling · prescription · A/B choice · card on file."
            },
            {
              "id": "M.3.3",
              "title": "Anchor",
              "spec": "Premium at 5–10× first, let the gasp land, then rescue with the main offer."

            {
              "id": "M.3.4",
              "title": "Rollover",
              "spec": "Credit paid toward next offer ≥ 4× the credit (discount ≤ 25%)."
            }
          ],
          "detail": "Upsells solve the customer's next problem the moment it appears — after purchase, before momentum dies. They fail three ways: wrong thing, wrong time, wrong delivery. Always feature the higher-profit option first.\n\n1. Classic — Solve the next immediate problem while the buying window is open. Surprise and delight, then present the option. Ask for the no early so a yes is possible (say-no-to-say-yes). Exploit the Hyper Buying Cycle: the short window right after purchase when appetites peak. Book the next meeting before ending the current one (BAMFAM). Present three price options to nudge buyers to the middle.\n2. Menu — Offer options instead of one upsell. Four moves: Unselling (name what they don't need), Prescription (name what they need and why), A/B choice (which one, not whether), card-on-file capture so every later yes takes one step.\n3. Anchor — Show a premium option at 5–10× the main price first, let the gasp land, then rescue them with the main offer, which now reads as cheap. Some buyers take the premium anyway — always keep one ready for budgets that can absorb it.\n4. Rollover — Credit what they already paid toward a bigger next offer. Rule: the next offer must be at least 4× the credit, keeping the effective discount at 25% or less. Four audiences: lapsed, upset, a competitor's customers, current customers. Pair with a winback campaign, one-time urgency, and a gift-card play (gift card at roughly 20% of the next offer's price)."
        },
        {
          "id": "M.4",
          "title": "Downsells — 3 types",
          "spec": "A trade, never the same thing cheaper.",
          "children": [
            {
              "id": "M.4.1",
              "title": "Payment plan",
              "spec": "Ladder: full-price reward → financing → half/half → want-check 8+ → trial."
            },
            {
              "id": "M.4.2",
              "title": "Trial with penalty",
              "spec": "Card first, then explain. Pay only if terms are broken."
            },
            {
              "id": "M.4.3",
              "title": "Feature downsell",
              "spec": "Remove high-value features to push back up; low-value for steep drop."
            }
          ],
          "detail": "A downsell is a trade, not a pressure play. Personalize it. Never repeat the same offer at a lower price — that trains buyers to wait you out.\n\n1. Payment Plan — Same product, same total price, spread over time. Work down this ladder in order:\n   - Reward for paying in full (the default frame).\n   - Third-party financing, alternate card, or layaway.\n   - Half now, half later.\n   - Want-check: \"1–10, how much do you want this?\" — proceed at 8 or higher.\n   - One-third down plus two payments.\n   - Evenly spread payments.\n   - Trial.\n   Align due dates to paychecks, re-run declined cards, and protect the share of buyers paying in full. Cadence shifts churn: roughly 10.7% monthly, 5% quarterly, 2% annual — start people on longer cycles when cash allows.\n2. Trial With Penalty — They start free if they meet the terms; they pay only if they don't. Mirror the Win Your Money Back criteria. Take the card first, then explain the penalty. Keep scenario-based upsells ready: loved it / hated it / never used it.\n3. Feature Downsell — Remove features to lower the price. Remove highest-value features first to push them back to the original; remove low-value features with a steep price drop to make the downgrade land. Name the combinations (aspirational top tier, and a clearly labeled minimum at the bottom). Accept reviews, testimonials, or referrals as partial payment when cash is the blocker."
        },
        {

          "detail": "Build continuity last, after the one-time offers work. You are stacking three levers: bonuses, discounts, and fees.\n\n1. Continuity Bonus — Add a bonus for joining today; it must be worth more than the first payment. Advertise the bonus, not the membership. The standalone-to-continuity price ratio steers the mix:\n\n   | Ratio | % choosing continuity |\n   |---|---|\n   | 1.33× | ~50% |\n   | 1.66× | ~60% |\n   | 2× | ~70% |\n   | 2.33× | ~80% |\n   | 2.66× | ~90% |\n\n   Add a bulk-prepaid upsell (for example, 10 months for the price of 12) — it lifts 30-day profit sharply even at a one-in-eight take rate.\n2. Continuity Discount — Trade free time for commitment. Apply it up front, at the end, spread across months, or after the first one or two payments. Bill every four weeks instead of monthly: 13 cycles a year instead of 12 adds about 8.3% revenue at the same listed price. Add a 3% processing fee. Capture a second payment method (ACH) so card failures don't churn customers.\n3. Waived Fee — Charge a setup fee of 3–5× the monthly rate, then waive it in return for a term commitment; leaving early makes the fee due. People stay longer when leaving costs more than staying. If over 5% cancel early, fix onboarding and delivery before adding more acquisition."

        {
          "id": "M.6",
          "title": "Client-Financed Acquisition",
          "spec": "Customer funds own acquisition in 30 days and funds 2+ more.",
          "children": [
            {
              "id": "M.6.1",
              "title": "Five CFA levels",
              "spec": "Recovered in 1st txn / 30d / 90d / 12mo / never = hobby."
            },
            {
              "id": "M.6.2",
              "title": "The math",
              "spec": "30-day GP ≥ 2 × (CAC + delivery). Recycle like an interest-free credit line."

            {
              "id": "M.6.3",
              "title": "Fix order",
              "spec": "Move upsell → raise price → 4-week billing → cut delivery → CAC last."

          ],
          "detail": "Client-Financed Acquisition (CFA) means the customer funds their own acquisition — fast. The 30-day rule: earn more gross profit from a customer inside 30 days than it costs to acquire and deliver to them. One customer should fund acquiring and servicing at least two more. Run the cycle monthly: it works like an interest-free 30-day credit line you can recycle forever.\n\nFive CFA levels:\n- Level 1: recovered in the first transaction.\n- Level 2: recovered within 30 days.\n- Level 3: recovered within 90 days.\n- Level 4: recovered within 12 months.\n- Level 5: never recovered — that is a hobby, not a business.\n\nRun this math per customer:\n\n30-day gross profit =\n  (core price − delivery cost)\n  + (upsell gross profit × take rate)\n  + (continuity revenue in month 1 − delivery × take rate)\n\nPayback check:   30-day gross profit ≥ CAC + delivery cost\nCFA target:      30-day gross profit ≥ 2 × (CAC + delivery cost)  → funds two more\nLTGP:CAC         = lifetime gross profit ÷ CAC\n\nSpeed compounds. Double value per customer, double volume, and double cycle speed → 8× growth. Triple all three → 27×.\n\nWhen the 30-day check fails, fix in this order:\n1. Add or move an upsell to the point of greatest need — fastest lift, no new delivery.\n2. Raise the core price in stages until profit peaks.\n3. Switch continuity to 4-week billing and add a prepaid option.\n4. Cut delivery cost with group or digital formats.\n5. Only then attack CAC with new creative or channels — acquisition is the slowest lever to move."
        },
        {
          "id": "M.7",
          "title": "Sequencing & rollover",
          "spec": "Stage I get cash → II more → III most. One offer at a time.",
          "children": [
            {
              "id": "M.7.1",
              "title": "Four checks",
              "spec": "Right stage · right problem · right delivery · right timing."
            },
            {
              "id": "M.7.2",
              "title": "Red rules",

            },
            {
              "id": "M.7.3",
              "title": "Fill gaps",
              "spec": "Affiliate products before building something new. One product, many offers."
            }
          ],
          "detail": "Three stages, each funded by the one before:\n- Stage I — Get cash: install the attraction offer. Get customers predictably.\n- Stage II — Get more cash: add upsells and downsells. Make customers pay for themselves.\n- Stage III — Get the most cash: add continuity. Make customers pay for other customers, then spend maximum on acquisition.\n\nWhen adding any offer, check four things: right stage (attraction acquires, upsell lifts order value, continuity retains), right problem (solvable with resources you already have), right delivery (solved the way the customer wants it solved), right timing (they are hungry for this now).\n\nOperating rules:\n- Build one offer at a time; never launch the whole model in one pass.\n- Put continuity last, then a bulk-prepaid upsell that rolls into recurring.\n- Roll credit forward only when the next offer is worth at least 4× the credit.\n- Raise prices in stages until profit peaks; start high and work down, never the reverse.\n- After a no, never offer the same thing cheaper — change the how or the what.\n- BAMFAM on every call that doesn't close.\n- Fill catalog gaps with affiliate products before building something new.\n- Keep it simple: many offers can run on one product. Delivery complexity is what kills execution."

          "detail": "Run a fast-cash campaign when money is needed now: bridging payroll, funding a new ad channel, covering a seasonal dip, or validating a new offer before committing.\n\nSequence the launch:\n- 7 days out: tease something big.\n- 5 days out: announcement plus core offer details.\n- 3 days out: reveal bonus one.\n- 2 days out: bonus two plus scarcity.\n- 1 day out: final bonus plus urgency.\n- Day of: open the cart with a countdown.\n- Then 24 / 12 / 6 / 1 hours out: reminder, warning, last chance, cart closing.\n\nTools that stack cash quickly:\n- Prepaid annual or bulk offers (10 months for 12).\n- Bonus stacks with real deadlines — bonuses expire, price rises.\n- Rollover winback to lapsed customers and their stored credit.\n- Announced price increases with a grandfather window for existing buyers.\n- Affiliate promotions for adjacent products.\n\nSmall campaign math: 10 buyers × $6,000 = $60,000, plus 3 new continuity customers. Run the payback check on the campaign's own spend before calling it a win."

    {
      "id": "S",
      "title": "Sales — convert demand",
      "kind": "branch",
      "accent": 4,
      "spec": "Belief transfer. 70% discovery / 30% pitch. Price only after value lands.",
      "children": [
        {
          "id": "S.1",
          "title": "CLOSER",
          "spec": "Six stages in order. Skipping one = untraceable objection later.",
          "children": [
            {
              "id": "S.1.1",
              "title": "C — Clarify",
              "spec": "“What made you book today?” Then stop talking. Reuse their exact words."
            },
            {
              "id": "S.1.2",
              "title": "L — Label",
              "spec": "“Tried X and Y, ended back at start because Z. Does that sound right?”"
            },
            {
              "id": "S.1.3",
              "title": "O — Overview",
              "spec": "“What have you tried, what happened?” Each failure = objection-proofing material."
            },
            {
              "id": "S.1.4",
              "title": "S — Sell the vacation",
              "spec": "They describe the after-state aloud. Three phases of mechanism, max."
            },
            {
              "id": "S.1.5",
              "title": "E — Explain away",
              "spec": "“What questions do you have?” Isolate → restate → answer with proof."
            },
            {
              "id": "S.1.6",
              "title": "R — Reinforce",
              "spec": "Onboard live on the call. Sale completes only on the first action."
            }
          ],
          "detail": "Run every call through these six stages in order. Skipping a stage shows up later as an objection you cannot trace.\n\nC — Clarify why they are here.\n- Open with a single question: \"What made you decide to book this call today?\" Then stop talking.\n- Follow with \"Tell me more about that,\" and repeat their own words back. Let them spend this phase describing the problem; the more they articulate it, the more they convince themselves.\n- Listen for emotional language, past spending, deadlines, and who else is affected. Note their exact phrases — you will reuse them in the label and the close.\n- If they open with a price question, deflect once: \"I'll answer that fully. First I need to understand your situation so the answer is accurate.\"\n\nL — Label their problem inside a pattern.\n- Stock line: \"So it sounds like you have tried X and Y, they worked for a while, and you ended up back where you started because of Z. Does that sound right?\"\n- Two jobs: demonstrate you have seen this pattern before, and make them feel understood.\n- \"Yes, exactly\" means continue. A shrug or correction means you misdiagnosed — go back and dig.\n\nO — Overview their past attempts.\n- Stock question: \"What have you tried so far, and what happened with each?\"\n- Three uses: show you care about their history; learn what not to position against (someone burned by a DIY course will not buy another DIY course); and set up your mechanism as the missing piece — \"Those stalled because they were missing [your mechanism].\"\n- Log every failed attempt and their stated reason. Each one becomes objection-proofing material for the pitch.\n\nS — Sell the vacation, not the plane ride.\n- Stock line: \"Imagine [timeframe] from now. You have [specific outcome]. How would that change things for you?\"\n- Have them describe the after-state out loud, in their own words. They sell themselves here.\n- Only then connect your mechanism to that destination, three phases at most. Keep the how high-level; the beach matters, not the flight.\n- Verify the four silent questions are answered: what do I get, how do I know it works, how long will it take, what do I have to do.\n\nE — Explain away their concerns.\n- Transition with: \"What questions do you have for me?\" Never \"What do you think?\" — it invites noise. Never \"Are you ready to start?\" — too early and it triggers retreat.\n- Translate every objection into its hidden question: \"Will this work in my specific case, given [worry]?\"\n- Handle with three moves: Isolate — \"Is that the only thing holding you back?\" Restate — \"If I can show you [evidence], do we move forward?\" Answer with proof — matched case study, mechanism explanation, guarantee, or logic.\n- Handle one objection at a time. Confirm resolution before advancing.\n\nR — Reinforce the decision.\n- Immediately after yes: \"You made a great decision. Here is exactly what happens next.\"\n- Walk through onboarding live on the call, book the next step, and confirm the first action before hanging up.\n- The sale is not complete until they take that first action. Reinforcement prevents buyer's remorse and no-shows."
        },
        {
          "id": "S.2",
          "title": "Objection taxonomy",
          "spec": "Name the door before answering. Wrong framework on right objection still loses.",
          "children": [
            {
              "id": "S.2.1",
              "title": "Price",
              "spec": "Often value/trust in costume: “If price weren't a factor, would you want it?”"
            },
            {
              "id": "S.2.2",
              "title": "Spouse",
              "spec": "Usually their own doubt outsourced. Handle the real concern as theirs."
            },
            {
              "id": "S.2.3",
              "title": "Time / stall",
              "spec": "Force specificity: the offer, the price, or whether it works for you?"
            },
            {
              "id": "S.2.4",
              "title": "Trust",
              "spec": "Normalize the burn. One lookalike case study > ten generic testimonials."
            },
            {
              "id": "S.2.5",
              "title": "Belief-shift",
              "spec": "Objection → hidden belief → new belief → proof. Plant it in the pitch."
            }
          ],
          "detail": "Every objection enters through one of a handful of doors. Name the category before you answer — the wrong framework on the right objection still loses.\n\nUniversal handling loop (use for any objection):\n1. Acknowledge without conceding: \"That is fair, and most of our best clients said something similar early on.\"\n2. Isolate: \"Is that the only thing holding you back?\"\n3. Restate: \"If I can address that, do we move forward today?\"\n4. Answer with proof: lookalike case study, mechanism, guarantee, or arithmetic.\n5. Confirm and re-ask for the decision, then stay silent.\n\nPrice / money\n- Words: \"Too expensive,\" \"I cannot afford it right now.\"\n- Hidden belief: \"I am not convinced it is worth it\" or \"I fear the value will not materialize.\"\n- Script: \"If price were not a factor at all, is this something you would want?\" Yes → the problem is logistics; present payment options. No → it is a value or trust objection wearing a price costume; return to mechanism and proof.\n- Reframe against inaction: \"What is this problem costing you every month it stays unsolved?\"\n- Never discount the core. Add a deadline-bound bonus, restructure payments, or change scope. Do not sell the same package cheaper.\n- Hold the number against the stacked value, not against their bank balance.\n\nSpouse / partner\n- Words: \"I need to talk to my spouse.\"\n- Hidden belief: usually their own uncertainty, outsourced to an absent third party.\n- Script: \"When you bring it up, what do you think they will say?\" If positive → offer a short joint call to answer questions. If negative or vague → \"What specifically would worry them?\" and handle that concern as if it were theirs, because it is.\n- Close test: \"If your partner had heard everything on this call, would they support it?\"\n\nTime / stall\n- Words: \"I need to think about it,\" \"Not the right time.\"\n- Hidden belief: \"I do not trust this enough yet,\" or \"This will take more effort than I have.\"\n- Force specificity: \"What exactly do you want to think about — the offer, the price, or whether it can work for you?\" Handle whichever surfaces; vague objections get vague answers, specific ones get resolved.\n- \"When would be the right time? What has to change first?\" Most prospects discover nothing external needs to change.\n- If the timing is real (cash cycle, seasonality), book the follow-up before they leave and send a written recap the same day.\n\nTrust / credibility\n- Words: \"How do I know this works?\" \"I have been burned before.\"\n- Hidden belief: \"I cannot afford another failure.\"\n- Normalize: \"You were let down before and you do not want that again. That is smart, not cynical.\"\n- Proof specificity beats proof volume: one case study that mirrors their exact situation beats ten generic testimonials.\n- Put risk on you with a guarantee that has teeth and plain terms.\n- Script: \"You do not have to trust me on faith — judge the guarantee and the results we have already produced.\"\n\nEffort / complexity\n- Words: \"I do not have time for this.\"\n- Hidden belief: \"This will be another hard project I abandon.\"\n- Reduce perceived effort live: show the templates, the onboarding, the done-for-you pieces. State honest hours per week and point at what you remove.\n\nIdentity\n- Words: \"This is not for someone like me.\"\n- Hidden belief: \"People who succeed at this are different from me.\"\n- Reframe with a lookalike: \"One of our best clients was exactly where you are, same background, same doubts.\"\n\nRisk\n- Hidden belief: fear of loss, failure, or looking foolish to others.\n- Match the guarantee type to the stakes: unconditional, conditional (action-based), outcome-based (results-tied), or anti-guarantee. Never promise what fulfillment cannot support.\n\nBelief-shift method (turn objections into selling points proactively):\n- Map: surface objection → hidden belief → new belief → proof.\n- Keep the new belief simple, believable, and grounded in reality. \"This is risky\" becomes \"This is a guided path with the risk on them.\"\n- Rewrite each as a selling point: objection → reframe → proof. Example: \"No time\" → \"Built to save you time\" → \"First result under 30 minutes with the starter template.\"\n- Place the top 3–5 objection responses in the pitch itself, the sales page, FAQs, and DMs so fewer of them ever reach the call.\n- If an objection repeats across calls, treat it as an offer defect: add proof, simplify the process, lower effort, clarify the outcome, or strengthen the guarantee."

          "detail": "- Obstacle close — after discovery, name the blockers and list them: \"It sounds like a few things stand between you and starting. Can we take them one at a time?\" Address each, then cross it off out loud. Visible progress makes the final ask feel small.\n- Decision framework close — lay out three paths: stay where you are, keep grinding alone, or use the proven system with help. Quantify the do-nothing cost honestly. \"Which one makes the most sense for you?\"\n- Future-pacing close — \"Six months from now you are at [outcome]. How does that feel? The only difference between that and today is the decision you make in the next few minutes.\"\n- Silence close — make the ask, then go quiet. Hold the pause. The first person to speak carries the tension, and that should not be you.\n- Payment-plan / downsell close — after a no, change how they pay or what they get. Never the same package for less; that trains buyers to refuse the first price.\n- Urgency close — real constraints only: bonus expiry, cohort start, genuine capacity. Manufactured deadlines poison referrals and refunds.\n- Sequencing rule — pick one close type per call. Stacking closes reads as pressure. If a close fails, go back to the unresolved objection, not to a fresh tactic."

          "detail": "- Concerned curiosity during discovery — you are genuinely digging into their situation, and it shows.\n- Confident authority when presenting the mechanism — you have watched it work repeatedly.\n- Calm certainty during objections — no flinching at the price, no rushing to fill silence.\n- Warm reinforcement after the close — they should feel good about the decision within seconds.\n- Posture: a diagnostician prescribing treatment, not a pressure seller. You are willing to walk away, and you act like it.\n- After every question, pause. Let silence pull the answer out; do not answer for them.\n- Match their pace, then slow down. Rushed, clipped speech reads as nervous; steady and slow reads as certain.\n- Use their words, not yours. Mirror the exact phrases from discovery in the label, pitch, and close.\n- One question at a time. Stacking questions when they hesitate signals you are not listening.\n- No jargon, no feature dumping. Translate every feature into an outcome or a removed cost."

          "detail": "Pre-call\n- Qualify at booking: budget range, decision authority, timeline, and why now.\n- Prime the call: confirmation message with agenda, duration, and what to have ready; reminders at 24 hours and 1 hour before. No-shows are usually a priming failure, not a lead failure.\n- Prepare the two or three proof assets closest to this prospect's situation, the guarantee wording, and the payment options.\n- Review their form answers, DMs, and notes beforehand. Walk in already knowing the likely top objection.\n\nCall — 45-minute high-ticket shape\n\n| Minutes | Segment |\n|---|---|\n| 0–5 | Rapport + clarify why they are here |\n| 5–15 | Problem deep-dive + past attempts |\n| 15–20 | Dream outcome + transition to solution |\n| 20–30 | Offer + value stack + price |\n| 30–40 | Objections + isolation |\n| 40–45 | Close + reinforce + schedule the next step |\n\n- Target roughly 70% of the call on their situation, 30% on your solution. If the offer is still landing after minute 30, you spent too long on biography.\n- Present the mechanism before the price, and present price as a contrast to the stack, never as a naked number.\n- End every held call with a scheduled next action — including the noes.\n\nFollow-up and speed-to-lead\n- Answer every new lead within five minutes where humanly possible. If nobody ever marvels at your response speed, you are too slow.\n- Book same-day or next-day appointments. Every extra day between booking and call raises the no-show rate.\n- Reply to texts and emails within minutes, not hours. Response speed telegraphs your interest level and predicts theirs.\n- Follow-up grid:\n\n| Channel | Timing | Purpose |\n|---|---|---|\n| Text | Within minutes | Confirm, answer, schedule |\n| Email | Same day | Recap, details, value |\n| Phone | 24–48 hours | Personal touch, reschedule |\n| DM | Ongoing | Relationship, keep warm |\n\n- Plan seven or more touches. Every contact delivers value or moves them to a next step — never send \"just checking in.\"\n- Base sequence: immediate text, same-day email plus one call attempt, day 2–3 case study with two concrete time slots, day 4–7 personal call and objection FAQ, week 2+ weekly value touch.\n- Re-contact no-decision leads in 30–90 days with a new reason to talk (new proof, bonus window, price change). Re-run dormant cold lists every 3–6 months."

          "detail": "- One-call close — use when budget is qualified before the call, intent is high, the offer is simple enough to explain in one sitting, and the decision-maker is on the line. Fastest cash; it demands a strong closer and a clean pre-call frame.\n- Two-step close — use when multiple stakeholders decide, the offer is complex or regulated, trust must be built, or the prospect is low-awareness and needs education first. Step one diagnoses and educates; step two decides.\n- Add a step when: calls routinely run past 60 minutes, most calls end with \"I need to talk to my partner,\" decision-makers no-show, or the price is high relative to existing trust.\n- Collapse back to one call when: second-call show rates fall under roughly 50–60%, the gap between calls cools interest, or the first call already delivers full clarity.\n- Either structure, keep the promise consistent across steps: the setter's framing must match the closer's agenda, or distrust shows up in the first five minutes.\n- When a one-call process underperforms, fix the set-to-close handoff — pre-framing, qualification, reminder sequence — before adding another call."

          "detail": "- Treat every sale as transference of belief. The prospect already wants the outcome; what is missing is certainty that the path works for them specifically. Move belief, not pressure.\n- Four beliefs must land before the close: the problem is solvable; your mechanism is why it gets solved; you and your team can execute; they can do their part.\n- Certainty beats cleverness. The party with more conviction usually takes the exchange, and neediness is felt instantly — on calls and in text.\n- Earn conviction before the call: know the mechanism cold, hold three concrete proofs, and rehearse the explanation until it is simple enough for a skeptic.\n- Build the mechanism story: \"Those methods failed because of [root cause]. We solve that with [mechanism].\" It must be simple, believable, and grounded — no magic language.\n- Sequence proof by closeness: their own words repeated back → logical mechanism → lookalike case study → guarantee.\n- Delivery leaks uncertainty: hedges, rushed speech, over-explaining, and talking past the ask all read as doubt. Say the thing, then stop.\n- Conviction must be real. If you cannot honestly be certain the offer fits this buyer, disqualify instead of pushing. That honesty is what makes your certainty credible on every other call."

          "detail": "Revenue moves through exactly three levers. Every tactic feeds one of them:\n\nRevenue = Customers × Revenue per Customer × Purchase Frequency\n\nPull them in this order:\n\n1. Price first. The increase costs almost nothing beyond a conversation and flows straight to profit. Test it before spending another dollar on ads.\n2. Frequency second. More purchases per customer — continuity, replenishables, sequels and levels, win-backs — beats buying strangers.\n3. New customers last. Acquisition is the most expensive lever. It only works when the offer and payback math already work.\n\nRevenue-per-customer tactics: raise list price; add a premium tier; bundle; upsell at point of sale; cross-sell an adjacent need.\n\nFrequency tactics: membership or subscription; consumables; sequential programs (Level 1 → 2 → 3); reactivation campaigns; retention work that extends lifespan.\n\nFour leverage types — stack them in sequence, not all at once:\n\n| Type | What it is | How you use it |\n|---|---|---|\n| Labor | Other people's work | Hire, train, build a management layer |\n| Capital | Other people's money | Paid ads, inventory, acquisitions, tooling |\n| Code | Software and automation | Self-serve onboarding, digital products, AI |\n| Media | Content and brand | Videos, books, podcasts that compound while you sleep |\n\nMost operators only use labor, and only their own. The compounding sits in stacking code and media on top of labor and capital."
